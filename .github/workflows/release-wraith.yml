name: Release Wraith Wallet

# Triggered on Wraith-specific tags so the existing repo-wide v* tags
# (which build ghost-pool / ghost-cli / etc.) don't accidentally cut a
# wallet release with a stale binary.
on:
  push:
    tags:
      - 'wraith-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifacts (e.g. 1.8.0). Defaults to the workspace version."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run release script
        shell: bash
        env:
          # Signing intentionally not wired here — secrets aren't in this
          # repo, and the policy is "manual signing on a build host". The
          # script skips signing cleanly when the env var is unset.
          WRAITH_RELEASE_SIGNING_KEY: ""
        run: |
          # Honour an explicit version override from workflow_dispatch; on
          # tag pushes use the workspace version (release-wraith.sh's
          # default), so the tag and Cargo.toml stay the source of truth
          # together.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            bash scripts/release-wraith.sh "${{ github.event.inputs.version }}"
          else
            bash scripts/release-wraith.sh
          fi
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wraith-wallet-${{ matrix.triple }}
          path: |
            dist/wraith-wallet-*.tar.gz
            dist/wraith-wallet-*.tar.gz.sha256
            dist/wraith-wallet-*.manifest.json

  # Windows installer. Separate from the Linux tarball job because the packaging
  # is fundamentally different: we run Tauri's bundler (`tauri build`) to produce
  # a `.msi`, bundling `wraithd` as a sidecar so the installed app is complete
  # (GUI + daemon). windows-latest already ships WebView2, so no extra runtime is
  # needed; Tauri downloads the WiX v3 toolset it uses for MSI on first run.
  build-msi:
    name: Build Windows installer (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    env:
      # Default MSVC target on windows-latest — the toolchain the IPC port
      # targets (avoids the mingw/aws-lc-sys issues the gnu target hits).
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # aws-lc-sys (pulled in transitively by rustls 0.23's default aws-lc-rs
      # backend, via ghost-common / wraith-protocol / reqwest) needs NASM to
      # build its assembly on Windows MSVC. windows-latest ships MSVC + CMake
      # but NOT NASM, so install it and put it on PATH before the Rust build.
      - name: Install NASM (required by aws-lc-sys on Windows)
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/wraith-wallet/gui
        run: npm ci

      - name: Build wraithd for the Windows target
        shell: bash
        run: cargo build --release --target "$TRIPLE" -p wraith-wallet-daemon

      - name: Stage wraithd as the Tauri sidecar
        shell: bash
        run: |
          # Tauri's externalBin requires the binary named with the exact target
          # triple suffix (and .exe on Windows) next to src-tauri/binaries/.
          SIDECAR_DIR="apps/wraith-wallet/gui/src-tauri/binaries"
          mkdir -p "$SIDECAR_DIR"
          cp "target/${TRIPLE}/release/wraithd.exe" "$SIDECAR_DIR/wraithd-${TRIPLE}.exe"
          ls -la "$SIDECAR_DIR"

      - name: Build MSI installer
        working-directory: apps/wraith-wallet/gui
        shell: bash
        run: |
          # `tauri build` compiles the GUI crate (for the host MSVC target) and
          # runs the WiX bundler. --target keeps the sidecar triple in sync with
          # the wraithd we just staged. Only the msi bundle is requested.
          npm run tauri build -- --target "$TRIPLE" --bundles msi

      - name: Locate MSI
        shell: bash
        run: |
          # Workspace target dir lives at the repo root, so the bundle lands in
          # target/<triple>/release/bundle/msi/.
          find target -type f -name '*.msi' | sort

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: wraith-wallet-${{ env.TRIPLE }}-msi
          path: |
            target/${{ env.TRIPLE }}/release/bundle/msi/*.msi

  release:
    name: Create Draft Release
    needs: [build, build-msi]
    if: startsWith(github.ref, 'refs/tags/wraith-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Layout
        shell: bash
        run: find artifacts -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          # Always draft — the release engineer is expected to:
          #   1. Download the manifest + tarball locally
          #   2. Sign the manifest with the offline release key
          #   3. Upload the .asc back to the draft
          #   4. Publish
          # That gate is the point — automated signing in CI would defeat
          # the threat model these manifests guard against.
          draft: true
          generate_release_notes: true
          name: "Wraith Wallet ${{ github.ref_name }}"
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/**/*.manifest.json
            artifacts/**/*.msi
