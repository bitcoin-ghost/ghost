name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run without cutting a tag. Everything builds and the artifacts are
  # uploaded, but the release itself is skipped (see the `release` job's `if`).
  #
  # Until this existed the only way to exercise this workflow was to tag, which
  # is why a glibc floor sat in the Linux artifact unnoticed across every release
  # (#540): nobody could run it to find out.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, deliberately, NOT ubuntu-latest.
          #
          # glibc is backward compatible but not forward compatible: a binary
          # linked on 24.04 (glibc 2.39) demands >= 2.38 at runtime and will not
          # start on anything older. The released ghost-pool did exactly that,
          # excluding Ubuntu 22.04 LTS (2.35, supported to 2027) and Debian 12
          # (2.36) — and our own fleet is all 24.04, so it was invisible (#540).
          #
          # Building on 22.04 lowers the floor to 2.35, which still runs on
          # 24.04. Nothing is lost by building older; reach is lost by building
          # newer. Verify with:
          #   objdump -T ghost-pool | grep GLIBC_ | sed 's/.*GLIBC_//' | sort -V | tail -1
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Install system dependencies (Linux)
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ghost-pool/ghost-pay (Rust) need libsqlite3 + capnproto (the SV2
          # stratum-core dep). The Linux job ALSO builds ghostd (the C++ Bitcoin
          # Core daemon) below, which needs the standard Core build deps: a
          # compiler + CMake + pkgconf, libevent, boost, and libzmq. WITH_ZMQ is
          # ON (see the ghostd build step) because ghost-pool subscribes to
          # ghostd's ZMQ hashblock/sequence feed, so libzmq3-dev is required; the
          # capnproto/libsqlite3 packages above double as ghostd's IPC
          # (ENABLE_IPC) and wallet (ENABLE_WALLET) dependencies.
          sudo apt-get install -y \
            libsqlite3-dev capnproto libcapnp-dev \
            build-essential cmake pkgconf python3 libevent-dev libboost-dev libzmq3-dev

      # Cap'n Proto >= 1.0 from source (Linux only).
      #
      # 22.04's apt ships capnproto 0.8.0, and libmultiprocess REFUSES it — CVE-2022-46149. So the
      # move to 22.04 in #541, which existed to stop the artifact demanding glibc 2.38, made the
      # Linux build fail outright at CMake configure (#549).
      #
      # Building 1.0.2 here rather than passing -DENABLE_IPC=OFF is deliberate: ENABLE_IPC is left ON
      # on purpose so the released binary matches the fleet's reference binary. Turning it off would
      # quietly ship an artifact without multiprocess support because of an apt version, which is a
      # change to what we distribute, not a build detail.
      #
      # The apt capnproto above is still installed and still wanted — the Rust SV2 stratum-core dep
      # uses it, and 0.8.0 is fine for that. This install goes to /usr/local, which pkgconf and CMake
      # both prefer, so only the C++ ghostd build picks up 1.0.2.
      - name: Cap'n Proto >= 1.0 for ghostd IPC (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          curl -fsSL https://capnproto.org/capnproto-c++-1.0.2.tar.gz -o capnproto.tar.gz
          # Pinned digest, verified against the tarball actually published at capnproto.org. No
          # fallback: an unverified download that builds anyway is worse than no check at all.
          echo "9057dbc0223366b74bbeca33a05de164a229b0377927f1b7ef3828cdd8cb1d7e  capnproto.tar.gz" \
            | sha256sum -c -
          tar xzf capnproto.tar.gz
          cd capnproto-c++-1.0.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          # Assert we actually got >= 1.0, so a silent fallback to apt's 0.8.0 cannot pass.
          ver=$(PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion capnp)
          echo "capnp now $ver"
          case "$ver" in 1.*|2.*) ;; *) echo "capnp is $ver, expected >= 1.0"; exit 1 ;; esac

      # Install system dependencies (macOS) — capnproto for the SV2 stratum-core dep
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      # Build only the binaries this release ships (node + SV2). Building the
      # whole workspace would pull in the desktop wallet/mobile apps (Tauri GUIs
      # need webkit, and the wallet daemon may be mid-development) which are not
      # release artifacts here.
      - name: Build
        run: |
          # CRITICAL: BOTH ghost-pool AND ghost-pay must be built with their own
          # zk-production feature so the released binaries can run on mainnet.
          # Without it, is_production_mode() is false and the binary aborts at
          # startup ("MAINNET SECURITY: ZK consensus on mainnet requires trusted
          # setup parameters"), so every curl|bash install crash-loops. ghost-pay
          # has a SEPARATE `zk-production` feature (ghost-zkp/zk-production) — it is
          # NOT enabled transitively by ghost-pool/zk-production, so it must be
          # listed explicitly. zk-production is a compile-time flag with no
          # build-time artefacts (params load at runtime), so this is safe.
          cargo build --release --target ${{ matrix.target }} \
            --features ghost-pool/zk-production,ghost-pay/zk-production \
            -p ghost-pool -p ghost-cli -p ghost-pay -p ghost-gsp-bin \
            -p translator_sv2 -p pool_sv2 -p jd_client_sv2 -p jd_server_sv2

      # Build ghostd (the C++ Bitcoin Core daemon) so all THREE node binaries
      # (ghost-pool + ghost-pay + ghostd) ship in ONE signed release at ONE
      # version and can never drift apart. Linux only — the pool/elder fleet is
      # Linux, and a Bitcoin Core build is neither needed nor attempted on the
      # macOS targets.
      #
      # CMake derives the client version from the workspace Cargo.toml (watch for
      # the "Ghost client version (from workspace Cargo.toml)" log line), so the
      # tag's version is baked into ghostd automatically with no extra wiring.
      #
      # WITH_ZMQ=ON is REQUIRED, not optional: ghost-pool subscribes to ghostd's
      # ZMQ hashblock/sequence feed for new-block and reorg detection, so a
      # non-ZMQ ghostd would silently break the pool. ENABLE_IPC/ENABLE_WALLET
      # keep their defaults (ON) to match the fleet's reference binary; their
      # deps (capnproto, libsqlite3) are already installed above.
      #
      # We build only the `ghostd` target and disable tests/bench/gui/tx/util/
      # wallet-tool to keep the release build tractable (a Core build is ~20-40
      # min on the 4-core runner). If the runner ever OOMs, cap `-j"$(nproc)"` at
      # -j2 and/or add -DCMAKE_CXX_FLAGS="--param ggc-min-expand=1 --param
      # ggc-min-heapsize=32768".
      - name: Build ghostd (Linux release only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cmake -S ghost-core -B ghost-core/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_ZMQ=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=OFF \
            -DBUILD_UTIL=OFF \
            -DBUILD_WALLET_TOOL=OFF
          cmake --build ghost-core/build --target ghostd -j"$(nproc)"
          # Fail loudly here (not at packaging time) if the daemon didn't build.
          test -x ghost-core/build/bin/ghostd

      # Package binaries
      # Fail the build if the Linux artifact demands a newer glibc than we target.
      #
      # This is the check that did not exist: the floor was only discoverable by
      # downloading a published release and watching it fail to start on an older
      # distro. Asserting it here means a runner-image bump cannot quietly raise
      # the requirement again (#540).
      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          # Copy binaries (check actual names from target directory)
          for bin in ghost-pool ghost-cli ghost-pay ghost-gsp translator_sv2 pool_sv2 jd_client_sv2 ghost-light-wallet ghost-light-wallet-tui; do
            if [ -f "target/${{ matrix.target }}/release/${bin}${{ matrix.suffix }}" ]; then
              cp "target/${{ matrix.target }}/release/${bin}${{ matrix.suffix }}" dist/
            fi
          done

          # ghostd (C++) is built only on the Linux target (step above). Stage it
          # into the SAME dist/ so it lands inside the linux tarball alongside
          # ghost-pool + ghost-pay and is covered — with zero extra signing logic
          # — by the existing SHA256SUMS + GPG signature over the tarball.
          if [ -f "ghost-core/build/bin/ghostd" ]; then
            cp "ghost-core/build/bin/ghostd" dist/
          fi

          # Create archive only if dist has files
          cd dist
          if [ -n "$(ls -A .)" ]; then
            if [ "${{ runner.os }}" = "Windows" ]; then
              7z a ../bitcoin-ghost-${{ github.ref_name }}-${{ matrix.target }}.zip *
            else
              tar czvf ../bitcoin-ghost-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
            fi
          else
            echo "No binaries found to package"
            exit 1
          fi

      # The floor check MUST run here, after Package, and MUST read dist/.
      #
      # The previous version scanned target/<target>/release/*, which holds only the RUST
      # binaries — ghostd is built by CMake to ghost-core/build/bin/ghostd and is staged into
      # dist/ by the Package step ABOVE. So the guard never once inspected ghostd. It also
      # grepped 'GLIBC_', which cannot match 'GLIBCXX_' (that is GLIBC + XX_), so libstdc++
      # floors were invisible even for the binaries it did scan.
      #
      # Those compounded: the one binary with a libstdc++ problem was the one binary the guard
      # could not see. v1.11.21 shipped as Latest and does not start on Ubuntu 22.04 — ghostd
      # wants GLIBCXX_3.4.32, ghost-pool wants GLIBC_2.39, and only ghost-cli runs (#555).
      - name: Assert glibc and libstdc++ floors (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          MAX_GLIBC=2.35        # Ubuntu 22.04
          MAX_GLIBCXX=3.4.30    # Ubuntu 22.04 libstdc++6 (GCC 12)

          command -v objdump >/dev/null || { echo "::error::objdump missing — cannot verify floors"; exit 1; }

          inspected=0
          fail=0
          for bin in dist/*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            # Skip anything that is not an ELF executable (scripts, notes).
            head -c 4 "$bin" | grep -q $'\x7fELF' || continue
            inspected=$((inspected + 1))

            syms=$(objdump -T "$bin" 2>/dev/null || true)
            # `|| true` is REQUIRED on both. Under `set -e` with `pipefail`, a grep that
            # matches nothing fails the whole substitution and kills the step — and a pure-Rust
            # binary legitimately has NO GLIBCXX_ symbols at all. Without this the guard died on
            # the first such binary (ghost-cli, alphabetically first in dist/) after 20ms with no
            # output, which looks identical to a real floor violation.
            g=$(printf '%s' "$syms"  | grep -oE 'GLIBC_[0-9.]+'   | sed 's/GLIBC_//'   | sort -V | tail -1 || true)
            gx=$(printf '%s' "$syms" | grep -oE 'GLIBCXX_[0-9.]+' | sed 's/GLIBCXX_//' | sort -V | tail -1 || true)
            echo "  $(basename "$bin"): glibc=${g:-none} libstdc++=${gx:-none}"

            if [ -n "$g" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$g" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error::$(basename "$bin") needs glibc $g, above the $MAX_GLIBC floor"
              fail=1
            fi
            if [ -n "$gx" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBCXX" "$gx" | sort -V | tail -1)" != "$MAX_GLIBCXX" ]; then
              echo "::error::$(basename "$bin") needs libstdc++ GLIBCXX_$gx, above the $MAX_GLIBCXX floor"
              fail=1
            fi
          done

          # A guard that inspected nothing must FAIL, not pass. The previous one skipped a
          # binary whenever objdump produced no output and then evaluated an empty "worst",
          # so a broken or missing objdump would have reported success having checked nothing.
          if [ "$inspected" -eq 0 ]; then
            echo "::error::floor guard inspected 0 binaries in dist/ — refusing to certify"
            exit 1
          fi
          echo "inspected $inspected binaries"
          [ "$fail" -eq 0 ] || exit 1

      # Symbol scanning is what failed for v1.11.21, so prove it by RUNNING the packaged
      # binaries on the oldest supported distro rather than trusting the scan alone.
      - name: Smoke-test packaged binaries on Ubuntu 22.04
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/smoke.sh <<'SMOKE'
          set -u
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq libsqlite3-0 libevent-2.1-7 libzmq5 >/dev/null 2>&1 || true
          rc=0
          for bin in /dist/*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            head -c 4 "$bin" | grep -q $'\x7fELF' || continue
            out=$("$bin" --version 2>&1 || true)
            # Only a symbol-version failure is fatal here. A binary may exit non-zero for
            # its own reasons (missing config, needs a subcommand) and that is not our concern.
            if printf '%s' "$out" | grep -qE "version \`(GLIBC|GLIBCXX)_[0-9.]+' not found"; then
              echo "::error::$(basename "$bin") does not run on Ubuntu 22.04:"
              printf '%s\n' "$out" | head -5
              rc=1
            else
              echo "  $(basename "$bin"): starts OK"
            fi
          done
          exit $rc
          SMOKE
          docker run --rm -v "$PWD/dist:/dist:ro" -v /tmp/smoke.sh:/smoke.sh:ro \
            ubuntu:22.04 bash /smoke.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bitcoin-ghost-${{ matrix.target }}
          path: bitcoin-ghost-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    # Tag pushes only. A dispatch run is for testing the build, and must not
    # produce a release named after a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          # List basenames (not the nested download-artifact dirs) so the manifest
          # matches the flat published asset names — `sha256sum -c SHA256SUMS.txt`
          # then works wherever the assets are downloaded alongside it.
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done | sort > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      # PGP-sign the checksum manifest so releases are verifiable against the
      # maintainer key (fingerprint published in SECURITY.md). Requires repo
      # secrets GPG_PRIVATE_KEY (armoured private key) and GPG_PASSPHRASE; when
      # unset, the manifest is published unsigned.
      - name: PGP-sign SHA256SUMS
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      # Refuse to publish a release whose signature or checksums do not hold.
      #
      # The step above signs and verifies, but only when it runs — and it is gated on
      # `env.GPG_PRIVATE_KEY != ''`, where the variable comes from that step's OWN env block.
      # That works, and was verified against v1.11.19, but it works by a subtlety of when
      # step-level env enters scope for `if`. It reads like a bug, so a well-meaning refactor
      # that moves the env or rewrites the condition would silently skip signing and publish an
      # unsigned release with nothing to catch it.
      #
      # This gate does not care how the signing step is written. It asserts the OUTCOME on a tag
      # push: the detached signature exists, verifies, and covers the manifest that matches the
      # artifacts actually being uploaded. (Private board SEC-3.)
      - name: Verify the release is signed and the checksums match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f SHA256SUMS.txt.asc ]; then
            echo "::error::no SHA256SUMS.txt.asc — this tag would publish UNSIGNED."
            echo "::error::The signing step was skipped or failed. See private board SEC-3."
            exit 1
          fi
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt \
            || { echo "::error::signature does not verify against the manifest"; exit 1; }
          # And the manifest must describe the artifacts actually being uploaded, not a
          # stale copy of itself. Check each listed file by name, wherever it landed under
          # artifacts/ — no copying, so nothing depends on cp/find quoting.
          rc=0
          while read -r want name; do
            [ -n "$name" ] || continue
            path=$(find artifacts -type f -name "$name" | head -1)
            if [ -z "$path" ]; then
              echo "::error::manifest lists $name but no such artifact was built"; rc=1; continue
            fi
            got=$(sha256sum "$path" | cut -d" " -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::$name checksum mismatch: manifest $want, artifact $got"; rc=1
            else
              echo "  ok  $name"
            fi
          done < SHA256SUMS.txt
          [ "$rc" -eq 0 ] || { echo "::error::manifest does not match the artifacts"; exit 1; }
          echo "signed and checksums verified"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS.txt
            SHA256SUMS.txt.asc
