name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Tauri desktop crates (wraith-wallet-gui, ghost-tap-desktop) need a built
  # JS frontend (`dist/`) before `tauri::generate_context!` will compile, which is
  # a separate Node pipeline from the Rust workspace. They are excluded from the
  # pure-Rust jobs below and built on their own; everything else gets full coverage.
  WORKSPACE_EXCLUDES: --workspace --exclude wraith-wallet-gui --exclude ghost-tap-desktop
  # System packages the Rust workspace needs: Cap'n Proto (bitcoin-core-sv2 build
  # script) and SQLite (ghost-storage / ghost-pay).
  LINUX_DEPS: libsqlite3-dev capnproto libcapnp-dev
  # What the Tauri desktop crates need on top: webkit2gtk is the webview, and `patchelf` is
  # used by the bundler. A superset of LINUX_DEPS so the one install script covers both.
  TAURI_DEPS: >-
    libsqlite3-dev capnproto libcapnp-dev libwebkit2gtk-4.1-dev libgtk-3-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Runs here rather than in Coverage: this job is fast, needs no build, and
      # runs on pull requests, so a workflow that only breaks after merge (as the
      # Coverage job did for six commits) gets caught before it lands.
      - name: Check workflow line continuations
        run: |
          python3 -m pip install --quiet pyyaml
          ./scripts/check-workflow-scalars.sh
      # install-node.sh embeds copies of scripts it installs (it is fetched standalone
      # and has no repo to read). Nothing checked they stayed in step, which is how the
      # vardiff floor was fixed in one copy and not the other (#431).
      - name: Check inlined installer copies
        run: ./scripts/check-inlined-copies.sh
      # The stratum config is defined twice — the installer heredoc and
      # config/sri/translator-config.toml — because the installer is fetched standalone
      # and has no repo to read. They had silently diverged (#431).
      - name: Check stratum config agreement
        run: ./scripts/check-stratum-config-agreement.sh
      # The pre-deploy SV1 smoke test's declared-difficulty case could not distinguish
      # "delivered late" from "never delivered" — both printed the floor — which is what
      # misdirected the #455 investigation. This runs that case against fake pools with known
      # behaviour, so the check stays able to tell those apart. No node, no build.
      - name: SV1 smoke self-test
        run: python3 bins/translator-sv2/tests/sv1_handshake_smoke_selftest.py
      # deploy-node.sh gates every production deploy and its whole value is refusing. It once
      # would have deployed a reverted commit reporting all four gates satisfied (#459), so the
      # gate is driven against deliberately-bad state here. No ssh, no deploy.
      - name: Deploy-gate self-test
        run: ./scripts/test-deploy-gate.sh
      # Fuzz targets depend on internal APIs and rot silently when a signature changes.
      # One had been importing a module that no longer existed, unnoticed, because no job
      # built them (#468). Build only — running the fuzzers belongs in a scheduled job.
      - name: Fuzz targets build
        run: ./scripts/check-fuzz-targets.sh

  # Clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      # L-01: Removed needless_borrows_for_generic_args and useless_vec allows
      #
      # BLOCKING as of #401: `-D warnings`, not `-W`. The workspace carries zero clippy
      # warnings in its own code, so anything new is a regression introduced by the change
      # under review — which is the only moment it is cheap to fix.
      #
      # The six `-A` entries are pre-existing style choices, not new exemptions.
      #
      # One warning remains and is deliberately NOT covered: cargo reports that
      # proc-macro-error2 v2.0.1 contains code a future rustc will reject. It arrives via
      # ghost-cli -> tabled 0.20 -> tabled_derive, 2.0.1 is the latest published version, and
      # it is a cargo future-incompat NOTE rather than a rustc lint — so it does not fail this
      # gate and cannot be fixed here. It needs tabled to drop the dependency upstream.
      - run: cargo clippy $WORKSPACE_EXCLUDES --all-targets --all-features -- -D warnings -A clippy::derivable_impls -A clippy::clone_on_copy -A clippy::match_like_matches_macro -A clippy::manual_flatten -A clippy::redundant_slicing -A clippy::skip_while_next
      # A message type nothing dispatches is wiring that does not exist.
      - run: ./scripts/check-wiring.sh

  # Unused-dependency gate: fails if a crate declares a dependency it does not use.
  # Pairs with the per-crate `#![deny(unreachable_pub)]` ratchet — together they stop
  # dead code and dead deps from silently accumulating (see tasks/dead_code_audit_*.md).
  # Verified false-positives are marked `[package.metadata.cargo-machete] ignored` per crate.
  deps:
    name: Unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check for unused dependencies
        run: cargo machete

  # Integration test targets.
  #
  # CI ran `cargo test --lib --bins` (which does not build `tests/` targets at all) plus
  # `cargo test --test integration` (ONE named target). Between them they covered 1 of the
  # workspace's integration test files. `cargo metadata` reports 47 such targets — a
  # `bins/*/tests` + `crates/*/tests` glob finds only 14, because three packages sit elsewhere.
  #
  # `payout_ledger_e2e` had consequently been RED on `main` for an unknown period, failing with
  # "GHOST-02: 0/8 nodes approved" — which reads like a catastrophic payout bug and was in fact a
  # stale fixture. Nobody saw it because nothing ran it (#580).
  #
  # That target no longer exists: Stage 6 Release B deleted the BFT payout vote it exercised,
  # along with `fleet_rehearsal`. `regtest_shard_coinbase_e2e` is the shard's replacement and is
  # already in the sequence below. The rationale is kept because the failure mode it describes —
  # a test that nothing runs — is what this job exists to prevent.
  #
  # `regtest_mining_modes_e2e` arrived with this same release and was NOT in the sequence, which
  # is that exact failure mode again: `common::require_regtest()` returns `None` and the test
  # SKIPS rather than fails whenever `GHOST_REGTEST_REQUIRED` is unset, so a bulk `cargo test`
  # would have reported it green without ever starting a node. It runs FIRST, on a clean mempool,
  # because `empty_template_e2e` parks a transaction on purpose.
  #
  # This is a SEPARATE job, not a step on `test`, deliberately: adding it there pushed that job
  # from ~28 min past its 45-minute timeout and it was cancelled mid-run. Here it runs in
  # parallel and cannot slow the critical path. Linux only — the same rationale the
  # wraith-wallet step already documents.
  #
  # Exclusions:
  #   ghost-mpc / mpc-xproc-harness  -> `mpc-tests` job; they need a per-package feature that a
  #                                    workspace-wide `--tests` cannot set
  #   integration_tests_sv2          -> 18 targets that spin up real SRI pool / template-provider
  #                                    processes (58 `start_pool` call sites; 4 of the 65 tests
  #                                    are `#[ignore]`d, not 1 — two whole targets are entirely
  #                                    ignored). They need external services and a per-test budget
  #                                    this job does not have. The green subset now runs in a
  #                                    dedicated step below; the rest stays on #617.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      - name: Run integration tests
        run: |
          # bond_e2e execs the real ghost-pay binary and asserts it exists.
          cargo build -p ghost-pay
          cargo test $WORKSPACE_EXCLUDES --tests \
            --exclude ghost-mpc \
            --exclude mpc-xproc-harness \
            --exclude integration_tests_sv2
      # Run the ghost-pool e2e targets against a REAL regtest node (#770).
      #
      # Until now these reported green without ever executing. Nothing in CI started a regtest
      # ghostd, and the targets open with a skip-and-return, so they were compiled, run, printed
      # SKIP, and passed by doing nothing — seven tests' worth. `GHOST_REGTEST_REQUIRED=1` makes
      # an unreachable node a FAILURE rather than a skip, so that cannot silently recur.
      #
      # ⚠ Deliberately a SEPARATE step from the bulk `cargo test` above, and the targets run ONE
      # AT A TIME. cargo runs test binaries in parallel and these share a single chain:
      # `empty_template_e2e` parks a fee-paying transaction in the mempool on purpose, while
      # `regtest_shard_coinbase_e2e` requires an empty one and drains it. Run concurrently they
      # sabotage each other, so the sequencing is load-bearing rather than tidiness.
      #
      # Verified end to end on a blank chain before landing: 4 passed + 1 ignored, 1 passed,
      # 1 passed, including a real `submitblock` accepted by ghostd.
      - name: Start regtest ghostd
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/regtest-node.sh start
      - name: Run ghost-pool e2e tests against regtest
        timeout-minutes: 15
        env:
          GHOST_REGTEST_REQUIRED: "1"
          GHOST_REGTEST_PORT: "18453"
          BITCOIN_RPC_USER: ghost
          BITCOIN_RPC_PASSWORD: ghostpass
        run: |
          for t in regtest_mining_modes_e2e empty_template_e2e regtest_shard_coinbase_e2e; do
            echo "::group::$t"
            cargo test -p ghost-pool --test "$t"
            echo "::endgroup::"
          done
      - name: Stop regtest ghostd
        if: always()
        run: .github/scripts/regtest-node.sh stop
      # COMPILE the 18 sv2 integration targets without running them (#580).
      #
      # They cannot ALL be run here: 191 `start_pool`/`start_template_provider`/`start_sniffer` call
      # sites spin up real SRI processes. Un-excluding the lot would make main red and flaky, which is
      # worse than not running them — 9 of the 18 currently fail and 2 more exceed 420s. The five that
      # are genuinely green run in the step after this one.
      #
      # ⚠ 4 of the 65 tests are `#[ignore]`d, not 1 as this comment previously claimed, and two
      # targets (`bitcoin_core_ipc_integration`, `jds_block_propagation`) are ignored ENTIRELY — they
      # report `ok` having executed nothing.
      #
      # But COMPILING them is cheap — measured at 3m11s with no external services — and it catches the
      # rot that actually bit: `tests/integration` stopped compiling when f1c14cdb9 added a field to
      # `ShareConvergenceResponse`, and nobody noticed for weeks because nothing built it. Four
      # `PoolConfig` initializers went the same way during the ghost-registry deletion and were caught
      # only because that target had been repaired.
      #
      # A compile gate is most of the value for none of the flakiness. Running them properly needs CI
      # infrastructure for the SRI processes and stays tracked on #580.
      - name: Compile SV2 integration targets (no run)
        run: cargo test -p integration_tests_sv2 --no-run
      # The SV2 targets that actually run now live in their own `sv2-integration` job below.
      # They took ~14 minutes of measured wall clock once repaired, and this job already sits at
      # ~22 minutes against a 45-minute cap — bolting them on here would have spent the margin
      # that exists for the regtest e2e work above.

  # SV2 integration targets that pass, run for real.
  #
  # Its own job, not a step on `integration-tests`: the repaired set measures ~14 minutes and that
  # job is already at ~22 against a 45-minute cap. A separate job also runs in parallel, so this
  # costs no wall clock on the critical path.
  #
  # ## Why these targets and not the other four
  #
  # Triaged target-by-target on 2026-09-06. The failures were never in the SV2 path itself —
  # they were three configuration faults in the harness:
  #
  #   1. Every target that starts an SV1 miner passed a bare username, which #479 makes a
  #      REJECTED `mining.authorize`. No channel ever opened, and the test failed a minute later
  #      as "timeout waiting for OpenExtendedMiningChannel" — which reads like a protocol fault.
  #   2. The harness ran `open_channel_on_subscribe = false` while every production node runs
  #      `true`. That is the one configuration in which a serialising miner (minerd) is handed a
  #      placeholder extranonce and builds a 4-byte-short coinbase, so EVERY share is invalid:
  #      154 submitted, 154 rejected, nothing forwarded upstream.
  #   3. `TPROXY_MODE` is a process-global `OnceLock`; a file mixing aggregated and
  #      non-aggregated translators aborts mid-binary. Each `tests/*.rs` is one process, so the
  #      aggregated cases were split into their own files.
  #
  # Result: 5 green targets/15 real tests -> 17 targets/~47 tests.
  #
  # ⛔ Deliberately EXCLUDED, with reasons:
  #
  #   sv2_mining_device                  passes locally in 11s, hung >15min on a CI runner. It
  #                                      measures real CPU hashrate against a wall clock, which
  #                                      is the least reproducible thing a shared runner can do.
  #   translator_integration             7 passed / 2 failed — real progress from "never
  #                                      finished", but not green yet.
  #   translator_aggregated_integration  all 4 pass INDIVIDUALLY; hang when run together, so
  #                                      something beyond TPROXY_MODE is not isolated between
  #                                      tests in that binary.
  #   bitcoin_core_ipc_integration       3 of 3 `#[ignore]`d — reports ok having executed
  #   jds_block_propagation              1 of 1 `#[ignore]`d    nothing. A green that cannot
  #                                      fail is worse than no green at all.
  #
  # ⚠ Targets are listed EXPLICITLY. An exclusion list silently promotes every newly added target
  # to blocking the moment someone writes one, which is how a job people trust becomes a job
  # people disable.
  sv2-integration:
    name: SV2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      # Compile everything first, including the targets that are not run below. This is the gate
      # that caught the rot that actually bit: `tests/integration` stopped compiling when
      # f1c14cdb9 added a field to `ShareConvergenceResponse` and nobody noticed for weeks.
      - name: Compile all SV2 integration targets
        timeout-minutes: 20
        run: cargo test -p integration_tests_sv2 --no-run
      # ⚠ Per-target `timeout` as well as the job cap. Without it one hung target eats the whole
      # budget and every target after it reports as "not run" rather than as something a reader
      # can act on — which is exactly how sv2_mining_device's hang first presented.
      - name: Run the green SV2 integration targets
        timeout-minutes: 30
        run: |
          for t in pool_solo_mining \
                   pool_integration \
                   jd_integration \
                   jd_provide_missing_transaction \
                   jd_tproxy_integration \
                   jd_aggregated_tproxy_integration \
                   jdc_block_propagation \
                   jdc_cached_shares \
                   jdc_receives_submit_shares_success \
                   monitoring_integration \
                   monitoring_aggregated_topology \
                   extensions \
                   sv1 \
                   sniffer_integration \
                   template_provider_integration \
                   mining_device_fast_hasher_equivalence; do
            echo "::group::$t"
            timeout 420 cargo test -p integration_tests_sv2 --test "$t" -- --test-threads=1 \
              || { echo "::endgroup::"; echo "::error::$t failed or exceeded 420s"; exit 1; }
            echo "::endgroup::"
          done

  mpc-tests:
    name: MPC integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      - name: MPC lifecycle (small-cap harness)
        run: cargo test -p ghost-mpc --test mpc_lifecycle --features mpc-test-cap
      - name: MPC cross-process contribution flow
        run: cargo test -p mpc-xproc-harness --test xproc --features mpc-test-cap

  # Build and test
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Free up runner disk before the heavy `--all-targets` build. The default
      # GitHub Linux runner has ~14 GB free, which the full workspace build can
      # exhaust ("No space left on device", intermittent). Dropping preinstalled
      # toolchains we don't use reclaims ~20+ GB.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Install system dependencies (Linux)
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh

      # Install system dependencies (macOS). Cap'n Proto for bitcoin-core-sv2's
      # build script; SQLite ships with macOS.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      # Build
      - name: Build
        run: cargo build $WORKSPACE_EXCLUDES --all-targets

      # Run unit tests
      - name: Run unit tests
        run: cargo test $WORKSPACE_EXCLUDES --lib --bins

      # Feature-gated modules, which the run above does NOT compile (#530).
      #
      # `ghost-consensus` has `default = []` and gates two modules behind features:
      #
      #   #[cfg(feature = "zk-consensus")]  pub mod nullifier_route_handler;   <- L2 tree sync
      #   #[cfg(feature = "mpc-ceremony")]  pub mod mpc_handler;
      #
      # so plain `cargo test -p ghost-consensus` reports 267 passed while 72 tests are not even
      # compiled — including every test for the L2 tree-sync and nullifier-routing code that is
      # live on all 8 production nodes. A change to that module could be syntactically invalid
      # and still show a green suite; that is not hypothetical, it happened while fixing #517.
      #
      # The clippy job already uses `--all-features`, so this code IS type-checked. Only its
      # tests were missing, which is why nothing ever went red.
      #
      # NOT `--all-features`, deliberately. That would also switch on `ghost-verification`'s
      # `allow-insecure` (changing what the security tests actually assert) and `zk-production`
      # (which needs trusted-setup params a runner does not have). Naming the features keeps the
      # gain without either surprise.
      - name: Run unit tests (feature-gated consensus modules)
        run: cargo test -p ghost-consensus --lib --features zk-consensus,mpc-ceremony

      # Run wraith-wallet integration tests (separate from --lib --bins).
      # These spin up the real wraithd binary against a tempdir socket, plus
      # in-process mock GSPs — locks the wallet IPC and streaming push-channel
      # contracts. Linux only: macOS runners can't bind Unix sockets the same
      # way (shorter sun_path limit) and we don't need cross-platform coverage
      # here; the unit + lib tests above already do.
      - name: Run wraith-wallet integration tests
        if: runner.os == 'Linux'
        run: |
          cargo test -p wraith-wallet-ipc
          cargo test -p wraith-wallet-core --tests
          cargo test -p wraith-wallet-daemon --tests

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps $WORKSPACE_EXCLUDES --all-features

  # The Tauri desktop crates, which every other job excludes.
  #
  # They were excluded because `tauri::generate_context!` will not compile until the JS
  # frontend has been built into `dist/`, which is a Node pipeline the Rust jobs do not run.
  # That is a reason to give them their own job, not a reason to leave them untested: the
  # exclusion let a GUI change ship that did not typecheck, because nothing anywhere checked.
  #
  # Ordered cheapest-first on purpose. `tsc --noEmit` needs no system packages and catches the
  # class of mistake the exclusion was hiding, so it runs before anything downloads webkit.
  tauri:
    name: Desktop (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wraith-wallet/gui/package-lock.json
      - name: Install frontend deps
        working-directory: apps/wraith-wallet/gui
        run: npm ci --no-audit --no-fund
      - name: Typecheck the frontend
        working-directory: apps/wraith-wallet/gui
        run: npx tsc --noEmit
      - name: Build the frontend
        working-directory: apps/wraith-wallet/gui
        run: npx vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script AND this job's package list, because the list is passed
          # in through `LINUX_DEPS` rather than living in the script. Sharing the pure-Rust jobs'
          # key would hand this job a cache holding none of the packages it needs.
          key: apt-debs-tauri-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}-${{ env.TAURI_DEPS }}
      - name: Install Linux deps
        timeout-minutes: 10
        env:
          LINUX_DEPS: ${{ env.TAURI_DEPS }}
        run: .github/scripts/install-linux-deps.sh
      # The GUI bundles `wraithd` as a Tauri sidecar (`externalBin`), and
      # `tauri-build` fails at build-script time if the binary is not already
      # sitting at the target-triple path. So the daemon is built first and
      # placed where the bundler expects it — which also means CI proves the
      # desktop bundle can actually assemble, not just that its Rust compiles.
      - name: Build the sidecar daemon
        run: |
          cargo build -p wraith-wallet-daemon --bin wraithd
          triple=$(rustc -vV | awk '/^host:/ {print $2}')
          mkdir -p apps/wraith-wallet/gui/src-tauri/binaries
          cp target/debug/wraithd "apps/wraith-wallet/gui/src-tauri/binaries/wraithd-$triple"
      - name: Build the desktop crate
        run: cargo build -p wraith-wallet-gui

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # H-07: Security audit failures should block CI
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  # Minimum Supported Rust Version.
  #
  # Pinned to the version Cargo.toml declares, NOT stable. On @stable this job was a
  # second stable build wearing a different name — it could never have caught a
  # too-new feature slipping in, which is the only thing it exists to catch.
  #
  # If this job fails, the choice is to fix the code or to raise rust-version in
  # Cargo.toml. Do not quietly put it back to stable: that restores a green tick that
  # means nothing.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      - run: cargo check $WORKSPACE_EXCLUDES

  # Coverage. Runs on main, and on demand via workflow_dispatch.
  #
  # Main-only meant this job could not be exercised before merge — so a change that made it
  # hang was only discoverable after landing, which is exactly how #408 reached main and took
  # a run to GitHub's 6h cap. `workflow_dispatch` makes it testable on a branch first.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Free up runner disk before the instrumented build (see Test job note).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-debs
          # Keyed on the install script, which carries the canonical package list. Change the
          # list there and the key rotates on its own; a stale cache cannot outlive its contents.
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}
      - name: Install Linux deps
        timeout-minutes: 6
        run: .github/scripts/install-linux-deps.sh
      - name: Generate coverage
        # Match the Test job's selection (`--lib --bins`). The default `--tests`
        # also runs the `[[test]]` integration targets, several of which need
        # external infrastructure (a real bitcoin-core/ghostd node, a running
        # stratum server, a live cluster) that isn't available in CI — those
        # are exercised separately, not in the coverage gate.
        #
        # `integration_tests_sv2` is no longer excluded. It was dropped when its
        # sniffer test hung for 5h38m under instrumentation; the cause was mock and
        # sniffer listeners binding inside `tokio::spawn`, so a caller could dial an
        # address nothing was listening on yet. Fixed in #536 — this re-enables the
        # crate so the fix is actually exercised rather than assumed (#408).
        # Block scalar (`|`), not a plain one: a plain multi-line scalar is folded
        # onto a single line joined with a space, and YAML leaves the backslash
        # alone, so the shell sees `\ ` — an escaped space — and `--lib` arrives as
        # one token with a leading space rather than as a flag.
        run: |
          cargo llvm-cov $WORKSPACE_EXCLUDES \
            --lib --bins --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
