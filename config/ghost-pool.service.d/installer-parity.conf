# Brings a ghost-pool unit provisioned before the installer's current form into line with it (#1007).
#
# vm1-vm4 carry an older base unit: `After=ghostd.service`, `Wants=ghostd.service`, `RestartSec=10`.
# The installer has since written the four directives below, and every node provisioned after that
# has them, so the fleet started the pool under two different orderings and two restart delays.
#
# `After=` and `Wants=` ADD to what the base unit declares, so `Wants=ghostd.service` is kept.
# `Description=` and `RestartSec=` replace.
#
# A FRESH node does not need this file: install-node.sh writes these values into the base unit.
# scripts/ops/converge-ghost-pool-unit.sh refuses to run if this file and the installer disagree.
[Unit]
Description=Ghost Pool node
After=network-online.target ghostd.service
Wants=network-online.target

[Service]
RestartSec=15
