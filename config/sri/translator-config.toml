# Ghost Network - SRI Translator Configuration
#
# Translates Stratum V1 (JSON-RPC) from legacy miners to Stratum V2 for the pool.
#
# Architecture:
#   BitAxe (SV1) -> Translator (:3333) -> SRI Pool (:34255) -> ghost-pool (TDP)

# Listen for SV1 miners (standard stratum port)
downstream_address = "0.0.0.0"
downstream_port = 3333

# Protocol version
max_supported_version = 2
min_supported_version = 2

# Extranonce size for downstream miners
# Max value for CGminer: 8, Min value: 2
downstream_extranonce2_size = 8

# User identity prefix (miner usernames will be username.miner1, username.miner2, etc.)
user_identity = "ghost_miner"

# Channel aggregation
# true = all miners share one upstream channel (recommended for many small miners)
# false = each miner gets its own channel
aggregate_channels = false

# Open the upstream channel on mining.subscribe instead of mining.authorize.
#
# Serialising SV1 clients — proxies and rented-hashrate marketplaces such as Braiins
# Hashpower — wait for the subscribe RESPONSE before they will authorise. Deferring the
# channel open to authorize deadlocks them, and the 1.5s fallback answers subscribe with an
# 8-byte all-zero placeholder extranonce while the real prefix is 12 bytes. The coinbase
# reserves exactly 20 bytes for extranonce1+extranonce2, so a client that builds on the
# placeholder is 4 bytes short: malformed coinbase, wrong merkle root, every share invalid.
# mining.set_extranonce cannot rescue it — that is an OPTIONAL extension and these clients
# never send mining.extranonce.subscribe.
#
# With this on, the channel opens at subscribe under a provisional identity, the subscribe
# response carries the real extranonce first time, and the payout address travels per share
# in the worker TLV instead of in the channel identity.
#
# ROLLOUT GATE, default false. pool_sv2 must already understand a provisional channel
# identity on EVERY node before this is turned on anywhere — rolled the other way round the
# pool credits shares to nobody. Roll order: pool_sv2 fleet-wide, THEN flip this.
open_channel_on_subscribe = false

# Protocol extensions
# Worker-Specific Hashrate Tracking (0x0002) carries the per-share worker identity that the
# pool recombines with the channel-level address for attribution. REQUIRED here, and the pool
# must list it under `supported_extensions` — check-stratum-config-agreement.sh enforces that
# pairing, because a translator requiring an extension the pool does not support fails the
# handshake, and the reverse silently drops attribution.
supported_extensions = []
required_extensions = [0x0002]

# Monitoring endpoint
monitoring_address = "0.0.0.0:9092"

# Log file (optional)
# log_file = "/var/log/ghost/sri-translator.log"

# Difficulty configuration for SV1 miners
[downstream_difficulty_config]
# Vardiff floor and starting point for a new SV1 connection: 10 TH/s => difficulty ~23,283.
#
# This is the STARTING difficulty, not a cap, and starting high is strictly safer than
# starting low. Vardiff falls quickly for a small miner (/1.5, /2, /3 per 60s tick) but is
# capped climbing (x3-x5 above 1000% delta), so a large miner pointed at a low floor floods
# for minutes before converging. At 500 GH/s (difficulty 1,164) a 1 PH/s order produces
# ~200 shares/sec; at this floor it is ~2.3/sec. Rented-hashrate marketplaces also refuse to
# dispatch into a pool advertising a difficulty far below the order size.
#
# A BitAxe (~0.5-1.5 TH/s) converges down in about 3 vardiff ticks, and payouts are
# work-weighted, so a small miner loses share cadence during that window, not earnings.
# Hobby-tier floor: 1 TH/s -> starting difficulty ~2,328.
#
# Was 10 TH/s (~23,283), which is a bar set for a machine 10x larger than anything that
# actually connects here. Measured on a live Bitaxe Gamma: its ASIC finds results averaging
# 688 difficulty and peaking around 1,386, so at a 23,283 floor it had to get ~34x luckier
# than its typical result to submit ANYTHING. It found a share about every 267s, which left
# AxeOS estimating hashrate from two or three samples and displaying 26 TH/s for a 1.13 TH/s
# machine — the operator reasonably read that as a broken miner.
#
# The control group is bitaxe4, which reaches pool_sv2 directly at difficulty 2,215 and reads
# stable and truthful on the same hardware class.
#
# Payout is unaffected: it is proportional to work, and a share's work IS its difficulty, so
# the same hashrate earns the same at any floor. The cost is share VOLUME (~10x more rows,
# each gossiped to 8 nodes), which is why large miners belong on the farm tier (:4444) rather
# than here.
min_individual_miner_hashrate = 1_000_000_000_000.0
# Target shares per minute
shares_per_minute = 6.0
# Enable variable difficulty adjustment
enable_vardiff = true
# Idle miner timeout (seconds) - disconnect miners with no shares
idle_timeout_secs = 600

# Keepalive interval for downstream miners (seconds)
job_keepalive_interval_secs = 60

# Quantise every assigned difficulty to a power-of-two tier (SHARE_TIER_BIND).
# ⚠ DORMANT: leave this OFF (absent/false) until the release that arms
# `SHARE_TIER_BIND_HEIGHT` in ghost-pool — the translator has no chain view, so
# this flag IS its half of that gate and must flip in the SAME release as
# ghost-pool's height AND pool_sv2's `[share_tier_binding]` section
# (pool-config.toml). pool_sv2 logs a SHARE_TIER_BIND DESYNC error if the halves
# disagree. When armed, vardiff targets snap down to the tier below (2^n,
# floored at 2^10 = 1024) so a share's coinbase can commit to the tier it was
# assigned.
quantise_to_tiers = true

# Upstream SRI Pool connection
[[upstreams]]
address = "127.0.0.1"
port = 34256
# Must match the pool's authority_public_key
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"

# ── Port tiers (#410) ─────────────────────────────────────────────────────────
# One difficulty cannot serve both a 500 GH/s bitaxe and a 1 PH/s rented order.
# Sized for the bitaxe, a large order floods the pool for minutes while vardiff
# ramps (it caps corrections above 1000% to x3-x5 per 60s tick) and marketplaces
# reject the pool. Sized for the order, a bitaxe finds a share every ~200s and
# looks dead — which is what made the dashboard flap after the floor was raised.
#
# Uncomment to run a SECOND listener for farm/rental traffic. The hobby tier keeps
# `downstream_port`, so every miner already pointed here stays put and nobody has
# to be told to move; only large miners need the new port advertised to them.
#
# BEFORE ENABLING: open the farm port on the firewall and the load balancer on
# every node. A port that is advertised but unreachable is worse than no port.
#
# 4444 is a conventional stratum alternate and was verified free on every node. 6666 was
# considered and rejected: it is IRC-associated and blocked by default on some ISPs,
# corporate firewalls and AV suites, which is a poor property for the port you hand to a
# paying customer.
#
# The farm floor of ~232,827 is not a guess. avalonQ, a ~95 TH/s miner, vardiffed itself to
# 233,672 on this fleet without prompting — the pool has already measured the right starting
# difficulty for that size of miner, so the tier simply starts there instead of climbing.
#
# `hobby_max_individual_miner_hashrate` only logs a warning when a miner on the
# hobby port measures above it. It is a CAPACITY control, not anti-fraud: payout
# is proportional to work and a share's work IS its difficulty, so the same
# hashrate earns the same on either port. A large miner on the hobby port is not
# taking anything from anyone — it just costs this node ~20x the share
# validation, bandwidth and database writes.
#
# ENABLED BY DEFAULT on public mining nodes (operator decision, 2026-07-27). The hobby
# tier keeps `downstream_port`, so every miner already pointed at 3333 stays put; only
# large miners need 4444 advertised to them. Private/solo nodes do not get this listener:
# `install-node.sh` emits the block only for `mining_mode = "public_pool"`, and
# `reconcile-mining-firewall.sh` opens 4444 on the same condition.
[farm_tier]
port = 4444
min_individual_miner_hashrate = 100_000_000_000_000.0  # ~232,827 starting difficulty
hobby_max_individual_miner_hashrate = 50_000_000_000_000.0
