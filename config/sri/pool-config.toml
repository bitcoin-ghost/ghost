# Ghost Network - SRI Pool Configuration
#
# This pool connects to ghost-mining's Template Distribution Protocol (TDP) server
# and accepts SV2 connections from translators/miners.
#
# Architecture:
#   ghost-mining (TDP:8442) -> SRI Pool (SV2:34255) -> SRI Translator (SV1:3333) -> BitAxe

# Pool identity keypair — GENERATE YOUR OWN. Do not use a value from this file.
#
# This is the SV2 Noise authority keypair: it is how this pool proves it is itself to
# connecting translators and SV2 miners, which pin the public half. Anyone holding the
# secret half can present as your pool.
#
#     /opt/ghost/bin/pool_sv2 --generate-key
#
# prints both lines ready to paste. `install-node.sh` does this automatically, so a node
# provisioned by the installer already has a unique keypair and needs no action here.
#
# The placeholders below are deliberately not a valid keypair, so a config copied verbatim
# fails loudly at startup rather than silently running an identity somebody else knows.
#
# This file previously carried a REAL keypair — and the same one that ships as a test fixture
# in the upstream SRI project, so its secret half was public in two repositories. Any node
# provisioned from this file was authenticating with an identity anyone could assume. The
# affected nodes have been rotated to unique keys.
authority_public_key = "<GENERATE-WITH-pool_sv2---generate-key>"
authority_secret_key = "<GENERATE-WITH-pool_sv2---generate-key>"
cert_validity_sec = 3600

# Listen for SV2 miners/translators.
#
# ⛔ 34255, and the comment here used to say 34256 "different from ghost-mining's native stratum on
# 34255". Both halves were wrong. ghost-mining has no native stratum on 34255 — `pool_sv2` holds that
# port, which `install-node.sh` says in its own words and which its firewall block opens
# (`PORTS=(3333 34255)`). MEASURED on vm1/vm5/vm8 2026-10-06: the live config says 34255 and
# `ss -ltnp` shows `pool_sv2` listening on `0.0.0.0:34255`.
#
# An operator provisioning from this file got an SV2 pool on 34256 while their translator, their
# firewall and every doc pointed at 34255. Nothing would mine and nothing would say why. The port
# is now compared against the installer key-by-key by
# `scripts/check-stratum-config-agreement.sh` (#999).
listen_address = "0.0.0.0:34255"

# Coinbase reward destination — the installer substitutes this per node
# (`install-node.sh`: `addr(${PAYOUT_ADDRESS})`).
#
# ⛔ A deliberately INVALID placeholder, the same shape as the keypair above, so a config copied
# verbatim fails at startup instead of running with a value from this file. This carried a real
# **signet** address (`addr(tb1q...)`) while the network is mainnet — a placeholder that parses is
# one somebody pastes, and a signet-prefixed one in a mainnet reference is worse than one that
# cannot work at all (#999).
#
# ⚠ Note this is not where block rewards actually go in any case: ghost-mining assembles the real
# coinbase over TDP and sets `coinbase_tx_value_remaining = 0`, so pool_sv2 contributes no outputs
# of its own. That is a reason the value is easy to get wrong unnoticed, not a reason to ship one.
coinbase_reward_script = "addr(<YOUR-MAINNET-PAYOUT-ADDRESS>)"

# Pool identification
server_id = 1
pool_signature = "Ghost Network SRI Pool"

# Difficulty settings
# Shares per minute expected (used for vardiff calculation)
shares_per_minute = 6.0
# Batch size for share acknowledgments.
#
# ⛔ 1, not 10. This said 10 while `install-node.sh` writes 1 and every node measured
# (vm1/vm5/vm8, 2026-10-06) runs 1. The pool side of this file had no agreement check until #999,
# so the reference drifted from the thing that actually provisions nodes.
share_batch_size = 1

# Bounds on concurrent downstream connections (#994).
#
# ⛔ Commented out = the built-in defaults apply, NOT unlimited. The SV2 port is world-open and had
# no cap of any kind: a peer could complete the TCP handshake, send nothing, and hold a task, a
# socket and a descriptor until the pool shut down. Uncomment only to override.
#
#   max_downstream_connections   default 512
#       pool_sv2 normally holds ONE connection from the co-located translator plus any direct SV2
#       miners. The node advertises capacity for ~1,000 miners and nearly all of them arrive through
#       the translator's single upstream connection, so 512 is far above any legitimate shape.
#
#   max_connections_per_ip       default 64
#       A farm behind one NAT address can legitimately open several. 64 is generous for that and
#       still means one source cannot occupy the whole table.
#
# A value of 0 is clamped to 1 rather than honoured — a limiter set to zero would refuse the
# co-located translator and the node would mine nothing while every service reported healthy.
# max_downstream_connections = 512
# max_connections_per_ip = 64

# Protocol extensions
# Must SUPPORT what the translator REQUIRES (0x0002, worker-specific hashrate tracking).
supported_extensions = [0x0002]
required_extensions = []

# Monitoring endpoint
monitoring_address = "127.0.0.1:9090"

# Log file (optional)
# log_file = "/var/log/ghost/sri-pool.log"

# Share Webhook Configuration
# Native integration with ghost-mining for share accounting
[share_webhook]
url = "http://127.0.0.1:8080/api/internal/shares"
# MANDATORY (H-13). Must be byte-for-byte the co-located ghost-mining's
# [network] internal_api_secret from pool.toml. ghost-mining authorised this webhook by
# "the TCP peer is 127.0.0.1" alone, which every process on the box satisfies — and which a
# reverse proxy in front of :8080 hands to the whole internet. Each batch is now signed
# HMAC-SHA256 over `timestamp || body` under this secret.
# There is no default: pool_sv2 refuses to start without it, rather than mining into 401s.
secret = "${INTERNAL_API_SECRET}"
# ⛔ 1, not 50 — same drift as share_batch_size above. Measured live on vm1/vm5/vm8: 1.
# At 50 a node would hold up to 50 shares before posting them, which is also the setting that made
# the `batches delivered` deploy metric hard to reason about (#947).
batch_size = 1
batch_timeout_ms = 2000
max_retries = 3

# NODE POOL: the only mode. pool_sv2 refuses to start without this section and its relay.
# Every job carries its channel's GhostShare/v2 tag and the canonical coinbase of its slot class:
# treasury, the owed miners, the finder (fee_address, every transaction fee), the GHNP table root
# and the witness commitment. The translator must ship quantise_to_tiers = true.
#
# node_id is deliberately NOT set: pool_sv2 reads this node's identity from the co-located
# ghost-mining's /health at startup. Set it only if ghost-mining is unreachable at startup; when
# set it is checked against ghost-mining's answer and a mismatch refuses to start.
[node_pool]
# The node operator's fee address (P2SH, P2WPKH, P2WSH or P2TR).
fee_address = "${NODE_FEE_ADDRESS}"

# The share-chain relay and settlement, with their own store. The genesis is the network's
# (regtest, signet, mainnet): where this node's share chain starts.
[node_pool.relay]
# mainnet runs only on the start compiled into pool_sv2; signet and regtest use genesis_anchor.
network = "${NODE_POOL_NETWORK}"
listen = "0.0.0.0:8566"
peers = []
db_path = "/var/lib/ghost/node-pool.db"
genesis_anchor = "${NODE_POOL_GENESIS_ANCHOR}"
genesis_btc_height = 0
rpc_host = "127.0.0.1"
rpc_port = 8332
rpc_user = "${BITCOIN_RPC_USER}"
rpc_password = "${BITCOIN_RPC_PASSWORD}"
# Retention (W2.13). A ledger checkpoint is folded this many Bitcoin blocks below the share-chain
# tip (0: never; at least 40). prune = true deletes stored batches below the older of the two kept
# checkpoints; leave it off on archive nodes, which serve a fresh node's sync from genesis.
# checkpoint_depth = 288
# prune = false

# Template Provider Configuration
# Connects to ghost-mining's TDP server
[template_provider_type.Sv2Tp]
address = "127.0.0.1:8442"
# ghost-mining's TDP authority public key (from --tdp-enabled startup logs)
public_key = "9bWFgYocHgkMPKEu1y87CxuAa145YSFVkafJrf8L6hhRKrhLGTz"
