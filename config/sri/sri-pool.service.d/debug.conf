# Overrides the base unit's Environment=RUST_LOG for nodes provisioned before #903.
#
# The installer used to write RUST_LOG=debug, which made sri-pool ~30x louder than it
# needs to be and evicted the journal: on the loudest node that left 4.1 days of history
# against the other nodes' full two weeks, so counts were not comparable across the fleet
# and the node most in need of investigating had the least to investigate with.
#
# The mining message handler stays at debug deliberately -- its
# OpenExtendedMiningChannel / CloseChannel lines are what diagnose channel faults, and
# they are what pinned down #898.
#
# install-node.sh now writes this value into the base unit, so a FRESH node does not need
# this file. It exists to converge the nodes that already carry the old base unit, which
# systemd cannot be told to forget any other way without rewriting the unit itself.
[Service]
Environment=RUST_LOG=info,pool_sv2::channel_manager::mining_message_handler=debug
