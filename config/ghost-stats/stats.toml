# ghost-stats — public pool-stats aggregator
#
# Deployed to /etc/ghost/stats.toml on the web host (83.136.255.218).
#
# ⚠ Top-level keys MUST appear BEFORE the first [table] header. TOML assigns any key written after
#   `[server]` to the `server` table, so a `snapshot_path` placed at the bottom is silently parsed
#   as `server.snapshot_path`, ignored as unknown, and the default used instead. That failure is
#   invisible — the service starts fine and just never persists.

# Where the last good snapshot is mirrored. Without it a restart serves an empty page until the
# first cycle finishes, which is the blank-while-loading behaviour this service exists to remove.
snapshot_path = "/var/lib/ghost-stats/snapshot.json"

[server]
# Loopback only: nginx is the sole intended caller, and the summary is exposed publicly through
# the `/api/pool/summary` location rather than by binding this port to the world.
listen = "127.0.0.1:8790"

# Nodes are reached DIRECTLY, not through the public nginx proxy. That is deliberate: the proxy
# caps proxy_read_timeout at 10s, which is below the cost of several of these queries, so going
# through it would make the slow windows permanently unfetchable.
[[nodes]]
id = "vm1"
url = "http://83.136.251.162:8080"
[[nodes]]
id = "vm2"
url = "http://85.9.198.212:8080"
[[nodes]]
id = "vm3"
url = "http://213.163.207.46:8080"
[[nodes]]
id = "vm4"
url = "http://95.111.221.169:8080"
[[nodes]]
id = "vm5"
url = "http://94.237.102.192:8080"
[[nodes]]
id = "vm6"
url = "http://5.22.219.246:8080"
[[nodes]]
id = "vm7"
url = "http://212.147.227.108:8080"
[[nodes]]
id = "vm8"
url = "http://209.50.50.67:8080"

# Cadences are matched to measured query cost (2026-08-19, cache bypassed, through the public path):
#
#   mining/status                    0.16 s      pool/records?window=week      0.43 s
#   pool/next_payout                 0.15 s      pool/records?window=month  7-20   s  (504s)
#   pool/records?window=day          0.06 s      pool/leaderboard?window=day   6.65 s
#   pool/leaderboard?window=lifetime 0.16 s      pool/leaderboard week/month  >10   s  (504s)
#
# A "best in window" record can only improve until it ages out, so a longer cadence makes the
# answer older, never wrong. That is what makes these numbers honest rather than merely cheap.
[refresh]
status_secs = 30
payout_secs = 30
records_block_secs = 60
records_day_secs = 60
records_week_secs = 300
records_month_secs = 600
leaderboard_shares_secs = 60
leaderboard_best_day_secs = 120
leaderboard_best_week_secs = 300
leaderboard_best_month_secs = 600
# Generously above the slowest measured query: a background refresh has nobody waiting on it.
node_timeout_secs = 30
