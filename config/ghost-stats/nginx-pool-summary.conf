# Aggregated pool summary — add inside the `server { }` block for bitcoinghost.org in
# /etc/nginx/sites-enabled/bitcoinghost, alongside the existing /api/pool/vmN/ locations.
#
# ⚠ That file is a REGULAR FILE, not a symlink to sites-available. Edit sites-enabled (or both),
#   then `sudo nginx -t && sudo systemctl reload nginx`.
#
# `location =` is an exact match, which nginx evaluates before any prefix location, so this can
# never be shadowed by the /api/pool/ prefix blocks.
location = /api/pool/summary {
    limit_req zone=pool_api burst=1200 nodelay;

    proxy_pass http://127.0.0.1:8790/api/v1/pool/summary;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The upstream answers from memory in ~2ms. If it is not answering in 5s it is not answering.
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # Micro-cache so a burst of viewers collapses onto one copy. This costs nothing in freshness:
    # the snapshot only changes on its own refresh cadence, which is never faster than 30s.
    proxy_cache pool_api_cache;
    proxy_cache_lock on;
    proxy_cache_valid 200 15s;

    # The two directives the per-VM blocks are missing, and the reason the page was slow even
    # though it was "cached":
    #
    #   proxy_cache_use_stale ... alone only rescues requests that arrive WHILE another request is
    #   already updating. The first request after expiry still blocks for the full upstream cost —
    #   which is what produced `X-Cache-Status: EXPIRED` with a 4.6s wait, and 504s on vm6.
    #
    #   proxy_cache_background_update serves the stale copy IMMEDIATELY and refreshes behind it.
    #   Together they mean a client never waits on a refresh.
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
}
