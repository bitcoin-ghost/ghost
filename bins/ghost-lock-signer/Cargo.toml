[package]
name = "ghost-lock-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline co-signer for a Ghost Lock's key path"

# Deliberately few dependencies. This binary is meant to run on an air-gapped
# machine holding a spending key, so every crate it pulls in is attack surface
# that has to be trusted with that key. It does not link the wallet, an HTTP
# client, or an async runtime, because it needs none of them: it reads JSON on
# stdin and writes JSON on stdout.
[dependencies]
ghost-entropy = { workspace = true }
ghost-lock = { workspace = true }
bitcoin = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[[bin]]
name = "ghost-lock-signer"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
base64 = { workspace = true }
