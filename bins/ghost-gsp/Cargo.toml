[package]
name = "ghost-gsp-bin"
version = "0.1.0"
edition = "2021"
description = "Ghost Service Provider - Light wallet server for Ghost Pay"
license = "MIT"
repository = "https://github.com/bitcoin-ghost"
readme = "README.md"

[[bin]]
name = "ghost-gsp"
path = "src/main.rs"
# The library crate `ghost-gsp` (crates/ghost-gsp) also documents as `ghost_gsp`,
# so documenting this binary target collides on target/doc/ghost_gsp/ and races
# `cargo doc` to an I/O error. Binary entry-points carry no useful rustdoc; skip them.
doc = false

[dependencies]
# Workspace crates
ghost-gsp = { path = "../../crates/ghost-gsp" }
ghost-common = { path = "../../crates/ghost-common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Crypto/encoding
getrandom = "0.2"

# Bitcoin
bitcoin = "0.32"

# TLS — needed at process start to install the rustls CryptoProvider
rustls = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
