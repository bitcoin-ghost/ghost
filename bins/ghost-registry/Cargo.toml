[package]
name = "ghost-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bitcoin Ghost pool node registry and DNS load balancer"

[[bin]]
name = "ghost-registry"
path = "src/main.rs"

[dependencies]
# Internal crates
ghost-common = { workspace = true }

# Async runtime
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# HTTP client (for Cloudflare API)
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Database
rusqlite = { workspace = true }

# Utilities
chrono = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# Crypto (for signature verification)
bitcoin = { workspace = true }
secp256k1 = { version = "0.28.2", features = ["rand"] }
rand = { workspace = true }

# HMAC authentication (API-1, API-2)
hmac = { workspace = true }

# H-17: Unix permissions
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
