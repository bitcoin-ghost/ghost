[package]
name = "ghost-pay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ghost Pay L2 node - privacy-preserving payment layer"

[[bin]]
name = "ghost-pay"
path = "src/main.rs"

[dependencies]
# Internal crates
ghost-common = { workspace = true }
ghost-keys = { workspace = true }
ghost-locks = { workspace = true }
ghost-storage = { workspace = true }
ghost-reconciliation = { workspace = true }
ghost-zkp = { workspace = true }
ghost-glyph = { workspace = true }
ghost-mpc = { workspace = true }

# Async runtime
tokio = { workspace = true }

# CLI (need env feature for GHOST_PAY_PASSWORD)
clap = { version = "4.5", features = ["derive", "env"] }

# Networking
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Bitcoin
bitcoin = { workspace = true }

# Utilities
hex = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

# Cryptography (H-PAY-2: encrypted key storage, H-2: HMAC auth)
aes-gcm = { workspace = true }
scrypt = "0.11"
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

# Database (for direct queries on ghost-pay's blocks table)
rusqlite = { workspace = true }

# TLS for HTTPS (CRIT-API-1)
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper-util = { workspace = true }

# HTTP client for L2 transaction relay to ghost-pool
reqwest = { workspace = true }

# For E2E test example (ZK proof generation + encryption)
bellperson = "0.26"
blstrs = { workspace = true }
secp256k1 = { workspace = true }

[dev-dependencies]
# Round-trip test: drive the real coordinator-side BondLedger HTTP client
# (`GhostPayBondLedger`) against the live ghost-pay bond router to prove the
# wire shapes + error strings match byte-for-byte.
wraith-coordinator = { workspace = true }

[features]
# Use MPC ceremony parameters for ZK proofs (required for mainnet)
zk-production = ["ghost-zkp/zk-production"]
