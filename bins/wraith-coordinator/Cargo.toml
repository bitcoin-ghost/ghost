[package]
name = "wraith-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Wraith Lite v1 — single-round CoinJoin coordinator"

[lib]
name = "wraith_coordinator"
path = "src/lib.rs"

[[bin]]
name = "wraith-coordinator"
path = "src/main.rs"

[dependencies]
# Workspace crates
wraith-protocol = { workspace = true }
# Identity-pinning TLS: the bond ledger client pins ghost-pay's Ed25519
# identity cert against the co-located node_id via
# `ghost_common::tls::IdentityPinningVerifier`.
ghost-common = { workspace = true }

# Bitcoin (just needed for Network enum + re-exports)
bitcoin = { workspace = true }
bip322 = { workspace = true }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }

# Bitcoind RPC (BitcoindBroadcaster) + ghost-pay BondLedger HTTP
# client (GhostPayBondLedger). Both Broadcaster and BondLedger are
# SYNC traits. reqwest::blocking spawns its own tokio runtime which
# conflicts with the surrounding axum/tokio runtime — drops panic.
# ureq is pure-sync (no tokio entanglement) and exactly fits the
# "occasional sync HTTP call from inside an async handler" use case.
ureq = { version = "2.10", features = ["json", "tls"] }
# rustls ClientConfig wiring for the bond ledger's identity-pinned TLS. ureq
# 2.12 links the same rustls 0.23 as `ghost-common`, so the
# `Arc<rustls::ClientConfig>` we build with `IdentityPinningVerifier` is
# accepted directly by `AgentBuilder::tls_config`.
rustls = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialisation / config
serde = { workspace = true }
serde_json = { workspace = true }

# CLI + logging
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Crypto / encoding (for session ids etc.)
getrandom = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# Pull in tower's `util` feature locally so `ServiceExt::oneshot` is in scope
# for integration tests. The workspace tower only enables limit + timeout.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
# Used by the end-to-end blind-signature test to build a `PublicKey` from
# the coordinator's hex-encoded signing pubkey.
secp256k1 = { workspace = true }
# bond_e2e.rs stands up the REAL ghost-pay bond server as a subprocess and
# exercises the coordinator↔ghost-pay wire end-to-end. `ghost-storage` seeds
# L2 balances directly into the (real, SQLCipher-encrypted, v38) ghost-pay
# database and reads back `wraith_bonds` / held-bond sums for ground-truth
# assertions; `scrypt` re-derives the same DB key ghost-pay derives from
# `GHOST_PAY_PASSWORD`; `tempfile` provides the throwaway data dir.
ghost-storage = { workspace = true }
rusqlite = { workspace = true }
scrypt = { workspace = true }
tempfile = "3.10"
