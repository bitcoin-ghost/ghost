[package]
name = "ghost-pool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bitcoin Ghost mining pool node"

[lib]
name = "ghost_pool"
path = "src/lib.rs"

[[bin]]
name = "ghost-pool"
path = "src/main.rs"

[dependencies]
ghost-build-info.workspace = true
# Self-check capability probes (statvfs for archive disk-free check)
libc = "0.2"
# Install rustls process-level crypto provider once at startup
rustls = { workspace = true }
# Internal crates
ghost-common = { workspace = true }
ghost-buds = { workspace = true }
ghost-reaper = { workspace = true }
ghost-policy = { workspace = true }
ghost-storage = { workspace = true }
ghost-consensus = { workspace = true }
ghost-accounting = { workspace = true }
ghost-reconciliation = { workspace = true }
ghost-verification = { workspace = true }
wraith-protocol = { workspace = true }
# Embedded in-process Wraith coordinator, run when this node is elected a seat.
wraith-coordinator = { path = "../wraith-coordinator" }
ghost-glyph = { workspace = true }

# Async runtime
tokio = { workspace = true }
# HTTP server for the embedded coordinator (axum::serve + build_router).
axum = { workspace = true }

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
bitcoin = { workspace = true }
getrandom = { workspace = true }

# HTTP client for registry
reqwest = { workspace = true }

# Template Distribution Protocol (SV2) - from crates.io
template_distribution_sv2 = "4.0.2"
codec_sv2 = { version = "4.0.1", features = ["noise_sv2"] }
noise_sv2 = "1.4.1"
binary_sv2 = "5.0.1"
framing_sv2 = "6.0.1"
common_messages_sv2 = "6.0.2"
async-channel = "2.3"

# SV2 Application Helpers (for NoiseTcpStream)
stratum-apps = { path = "../../crates/stratum-apps", features = ["network", "core"] }

# Key utilities
bs58 = { version = "0.4.0", features = ["check"] }
secp256k1 = { version = "0.28.2", features = ["rand"] }
rand = "0.8"

[features]
# Both ZK consensus and MPC ceremony enabled by default
# ZK parameter generation is deferred to background task to avoid blocking startup
default = ["zk-consensus", "mpc-ceremony"]
# Enable ZK consensus for block/payout proofs
zk-consensus = ["ghost-consensus/zk-consensus", "ghost-zkp"]
# Enable MPC ceremony for ZK parameter generation
mpc-ceremony = ["ghost-consensus/mpc-ceremony", "ghost-mpc"]
# Use MPC ceremony parameters for ZK proofs (required for mainnet)
zk-production = ["ghost-zkp/zk-production"]
# Heap profiling. OFF by default and adds nothing to a normal build — it swaps in jemalloc
# with profiling compiled in, which is inert until enabled at runtime via MALLOC_CONF.
# Used to find what holds ghost-pool's ~2.2GB steady-state working set (see issue #418).
heap-profiling = ["dep:tikv-jemallocator"]

[dependencies.tikv-jemallocator]
version = "0.6"
features = ["profiling", "unprefixed_malloc_on_supported_platforms"]
optional = true

[dependencies.ghost-zkp]
workspace = true
optional = true

[dependencies.ghost-mpc]
workspace = true
optional = true

[dev-dependencies]
tempfile = "3.10"
# The arming tests must use the SAME adopted bytes the genesis pin was taken over, not a copy.
ghost-accounting = { workspace = true, features = ["test-fixtures"] }
