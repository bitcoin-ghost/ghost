# Audit-cluster regtest dry-run — 4 real ghost-pool nodes + a regtest ghostd,
# full mesh, CLUSTER_ENFORCEMENT_HEIGHT gate ON. Run BEFORE any mainnet deploy.
# See README.md for the runbook; tasks/plan_audit_cluster_deploy.md §3 for why.
#
#   cd docker/regtest-cluster && docker compose up -d
#
# Build the ghost-pool image WITHOUT --features zk-production (regtest needs no
# MPC params). The image must contain bash + gettext (envsubst) for the
# entrypoint — see README §Build.

x-pool-common: &pool-common
  image: bitcoin-ghost/ghost-pool:regtest
  entrypoint: ["/usr/bin/env", "bash", "/entrypoint.sh"]
  restart: "no"
  depends_on:
    bitcoind:
      condition: service_started
  environment:
    BITCOIN_RPC_USER: ghost
    BITCOIN_RPC_PASSWORD: ghostpass
    # Replace with `bitcoin-cli -regtest getnewaddress` output before `up`:
    TREASURY_ADDRESS: ${TREASURY_ADDRESS:?set TREASURY_ADDRESS to a regtest bcrt1 address}
  volumes:
    - ./pool.template.toml:/etc/ghost/pool.template.toml:ro
    - ./entrypoint.sh:/entrypoint.sh:ro
    # Bind-mount the binary rather than baking it into the image. The image's own
    # copy silently goes stale — it was v1.10.22 while the tree was v1.11.22, so a
    # cluster run "passed" against code months older than the change under test.
    # Refresh with: cargo build --release -p ghost-pool && cp
    # target/release/ghost-pool docker/regtest-cluster/bin/ghost-pool
    - ./bin/ghost-pool:/usr/local/bin/ghost-pool:ro

services:
  bitcoind:
    image: bitcoin-ghost/ghostd:regtest    # the ghost-core fork in regtest mode
    container_name: rc-bitcoind
    networks:
      rcnet:
        ipv4_address: 172.28.0.10
    command:
      - -regtest
      - -server=1
      - -txindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=ghost
      - -rpcpassword=ghostpass
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -zmqpubhashtx=tcp://0.0.0.0:28333
      - -fallbackfee=0.0002
    ports:
      - "18443:18443"   # RPC (for driving the dry-run from the host)

  pool1:
    <<: *pool-common
    container_name: rc-pool1
    volumes:
      - ./pool.template.toml:/etc/ghost/pool.template.toml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./bin/ghost-pool:/usr/local/bin/ghost-pool:ro
      - pool1-state:/root/.ghost
    networks:
      rcnet:
        ipv4_address: 172.28.0.11
    environment:
      NODE_NAME: pool1
      # TDP server: how pool_sv2 gets block templates. Only the node fronting the SV2
      # stack needs it — see mining/README.md for the full topology.
      EXTRA_ARGS: "--tdp-enabled --tdp-port 8442"
      SEED_NODES: '"172.28.0.12:8555", "172.28.0.13:8555", "172.28.0.14:8555"'
      GENESIS_ARG: "--genesis"          # genesis node bootstraps the elder set
      BITCOIN_RPC_USER: ghost
      BITCOIN_RPC_PASSWORD: ghostpass
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    ports:
      - "8080:8080"

  pool2:
    <<: *pool-common
    container_name: rc-pool2
    volumes:
      - ./pool.template.toml:/etc/ghost/pool.template.toml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./bin/ghost-pool:/usr/local/bin/ghost-pool:ro
      - pool2-state:/root/.ghost
    networks:
      rcnet:
        ipv4_address: 172.28.0.12
    depends_on:
      bitcoind: { condition: service_started }
      pool1:    { condition: service_started }   # start after genesis (≥60s, see README)
    environment:
      NODE_NAME: pool2
      SEED_NODES: '"172.28.0.11:8555", "172.28.0.13:8555", "172.28.0.14:8555"'
      BITCOIN_RPC_USER: ghost
      BITCOIN_RPC_PASSWORD: ghostpass
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    ports:
      - "8081:8080"

  pool3:
    <<: *pool-common
    container_name: rc-pool3
    volumes:
      - ./pool.template.toml:/etc/ghost/pool.template.toml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./bin/ghost-pool:/usr/local/bin/ghost-pool:ro
      - pool3-state:/root/.ghost
    networks:
      rcnet:
        ipv4_address: 172.28.0.13
    depends_on:
      bitcoind: { condition: service_started }
      pool1:    { condition: service_started }
    environment:
      NODE_NAME: pool3
      SEED_NODES: '"172.28.0.11:8555", "172.28.0.12:8555", "172.28.0.14:8555"'
      BITCOIN_RPC_USER: ghost
      BITCOIN_RPC_PASSWORD: ghostpass
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    ports:
      - "8082:8080"

  pool4:
    <<: *pool-common
    container_name: rc-pool4
    volumes:
      - ./pool.template.toml:/etc/ghost/pool.template.toml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./bin/ghost-pool:/usr/local/bin/ghost-pool:ro
      - pool4-state:/root/.ghost
    networks:
      rcnet:
        ipv4_address: 172.28.0.14
    depends_on:
      bitcoind: { condition: service_started }
      pool1:    { condition: service_started }
    environment:
      NODE_NAME: pool4
      SEED_NODES: '"172.28.0.11:8555", "172.28.0.12:8555", "172.28.0.13:8555"'
      BITCOIN_RPC_USER: ghost
      BITCOIN_RPC_PASSWORD: ghostpass
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    ports:
      - "8083:8080"

# Fixed subnet so each node's `public_address` and every `SEED_NODES` entry can be a
# literal IP. The Noise send path parses peer addresses with `SocketAddr::parse`,
# which does NOT resolve DNS — container names produced
# "Invalid peer address: invalid socket address syntax" on every send, so no
# encrypted traffic (votes, payouts, shard summaries) could leave a node.
networks:
  rcnet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ⚠ Node state MUST be persisted, and at /root/.ghost — not the `db_path` in
# pool.template.toml. `key_path`/`db_path` are not honoured for generation, so the node
# writes its identity, database and MPC contributions to $HOME/.ghost regardless.
#
# Without these volumes a `docker compose up --force-recreate <node>` silently resets that
# node: new node id, empty database, zero MPC contributions. Doing it to the genesis node
# collapses the elder set, and payout voting then fails `BFT requires at least 3 eligible
# voters` — which reads exactly like a consensus bug and is not one. Measured 2026-08-16:
# pool1 dropped to 1 contribution after three recreates while pool2-4 still held 4.
volumes:
  pool1-state:
  pool2-state:
  pool3-state:
  pool4-state:
