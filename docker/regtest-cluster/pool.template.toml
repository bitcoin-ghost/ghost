# Ghost Pool — regtest dry-run config TEMPLATE.
# The entrypoint runs `envsubst` over this file, so ${VARS} below are filled in
# per-node from each service's environment in docker-compose.yml.
#
# This cluster exists to run the audit-cluster dry-run from
# tasks/plan_audit_cluster_deploy.md §3 BEFORE any mainnet deploy:
# 4 real ghost-pool binaries on a regtest chain, full mesh, gate ON.

[identity]
key_path = "/var/lib/ghost/node.key"   # generated on first start, per-node volume
display_name = "${NODE_NAME}"

[bitcoin]
# 127.0.0.1, NOT `bitcoind`: a remote Ghost Core requires TLS and this regtest
# node serves plain RPC, so the entrypoint's socat sidecar forwards loopback to
# the real host. Pointing these straight at `bitcoind` fails startup outright.
rpc_host = "127.0.0.1"
rpc_port = 18443                        # regtest default RPC port
rpc_user = "${BITCOIN_RPC_USER}"
rpc_password = "${BITCOIN_RPC_PASSWORD}"
network = "regtest"                     # regtest → no zk-production / MPC params needed
zmq_hashblock = "tcp://127.0.0.1:28332"
zmq_hashtx = "tcp://127.0.0.1:28333"

[network]
# 32-byte hex consensus signing key (required for mining_mode=PublicPool);
# the entrypoint generates one per node.
signing_key = "${SIGNING_KEY}"
# The container's docker-assigned IP, filled in by the entrypoint. This must be an
# IP: a hostname is rejected by peer-address validation, so the DNS name that used
# to be here could never have formed a mesh.
public_address = "${NODE_IP}"
# The OTHER three nodes' discovery endpoints (set per-service in compose).
seed_nodes = [${SEED_NODES}]
sv2_port = 34255
sv1_port = 3333
http_port = 8080
max_miners = 1000
# `public_mining` was renamed; the old key is parsed but ignored with a DEPRECATED
# warning, which meant this cluster ran as whatever the default mode is rather than
# the public pool the dry-run is meant to exercise.
mining_mode = "public_pool"

[network.p2p]
share_propagation = 8555
block_announcement = 8556
consensus_voting = 8557
health_monitoring = 8558
discovery = 8559
elder_management = 8560
payout_proposal = 8561
payout_transaction = 8562

[policy]
profile = "bitcoin_pure"

[storage]
db_path = "/var/lib/ghost/data"
wal_mode = true
archive_mode = true
prune_height = 0

[pool]
# A valid REGTEST address (bcrt1…). Replace with one from
# `bitcoin-cli -regtest getnewaddress`.
treasury_address = "${TREASURY_ADDRESS}"
treasury_fee_percent = 1.0
min_payout_sats = 10000
payout_interval_blocks = 100

# NOTE: no `[ghost_pay]` section.
#
# `enabled = false` on its own does NOT disable the section — the table is parsed
# as fully present and the load fails with `missing field virtual_block_secs`, so
# every node died at startup. The section must be ABSENT (it then defaults to
# disabled) or fully populated. This file's own README already said so; the
# template did not match it.
