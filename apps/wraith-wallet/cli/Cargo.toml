[package]
name = "wraith-wallet-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wraith"
path = "src/main.rs"

[dependencies]
wraith-wallet-ipc = { workspace = true }
# For the dice/coin entropy accumulator and its digest construction. Shared
# rather than reimplemented: two versions of a seed derivation is exactly the
# kind of drift that produces a Coldcard.
wraith-wallet-core = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5"
tokio = { workspace = true }
# Cross-platform local IPC client (UDS on unix, named pipes on Windows).
interprocess = { workspace = true }
serde_json = { workspace = true }
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
