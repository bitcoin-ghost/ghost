[package]
name = "wraith-wallet-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wraithd"
path = "src/main.rs"

[dependencies]
wraith-wallet-core = { workspace = true }
wraith-wallet-ipc = { workspace = true }
# Coordinator-seat sharding (shard_for) for resolving an elected coordinator.
wraith-protocol = { workspace = true }
# Shard-key derivation (SHA256) for coordinator resolution.
sha2 = { workspace = true }
ghost-gsp-proto = { workspace = true }
ghost-keys = { workspace = true }
bitcoin = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
# Cross-platform local IPC listener (UDS on unix, named pipes on Windows).
interprocess = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
wraith-wallet-ipc = { workspace = true }
wraith-wallet-core = { workspace = true }
ghost-keys = { workspace = true }
ghost-gsp-proto = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
axum = { workspace = true }
bitcoin = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
# Implement the `ChainClient` trait on a test stub for `light_send` gating tests.
async-trait = { workspace = true }
