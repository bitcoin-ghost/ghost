[package]
name = "wraith-wallet-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wraith_wallet_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wraith-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
wraith-wallet-ipc = { workspace = true }
tokio = { workspace = true }
# Cross-platform local IPC client (UDS on unix, named pipes on Windows).
interprocess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Tauri GUI crate is excluded from the Rust workspace build (needs a JS
# frontend), so this cannot be verified with `cargo build`. cargo-machete flags
# it from static analysis alone; keep it pending a real frontend build.
[package.metadata.cargo-machete]
ignored = ["serde"]
