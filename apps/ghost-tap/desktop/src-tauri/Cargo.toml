[package]
name = "ghost-tap-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "ghost_tap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
ghost-tap-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
secrecy = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
reqwest.workspace = true
secp256k1.workspace = true
getrandom.workspace = true

# Tauri desktop crate is excluded from the Rust workspace build (needs a JS
# frontend), so these cannot be verified with `cargo build`. cargo-machete
# flags them from static analysis alone; keep them pending a real frontend build.
[package.metadata.cargo-machete]
ignored = ["tokio", "tracing"]
