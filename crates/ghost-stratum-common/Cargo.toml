[package]
name = "ghost-stratum-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stratum V2 protocol wrapper for Bitcoin Ghost - re-exports stratum-sri types with Ghost-specific helpers"

[dependencies]
# Stratum protocol crates (from stratum/ submodule)
stratum-core = { path = "../../vendor/stratum/stratum-core", features = ["translation"] }

# Re-export these for convenience (they're also in stratum-core but direct access is useful)
sv1_api = { path = "../../stratum/sv1" }
binary_sv2 = { path = "../../stratum/sv2/binary-sv2" }
codec_sv2 = { path = "../../stratum/sv2/codec-sv2", features = ["noise_sv2"] }
noise_sv2 = { path = "../../stratum/sv2/noise-sv2" }
mining_sv2 = { path = "../../stratum/sv2/subprotocols/mining" }
common_messages_sv2 = { path = "../../stratum/sv2/subprotocols/common-messages" }
framing_sv2 = { path = "../../stratum/sv2/framing-sv2" }
channels_sv2 = { path = "../../stratum/sv2/channels-sv2" }

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt"] }
async-channel = "2.3"

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

# Part of the out-of-workspace SV2 stack (path deps), so it can't be verified
# with `--all-features`; cargo-machete flags `serde` from static analysis alone.
[package.metadata.cargo-machete]
ignored = ["serde"]
