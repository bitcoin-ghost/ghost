[package]
name = "ghost-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "P2P consensus mesh and BFT voting for Bitcoin Ghost"

[dependencies]
ghost-common = { workspace = true }
ghost-storage = { workspace = true }
tokio = { workspace = true }
tmq = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
snow = { workspace = true }
getrandom = { workspace = true }
bytes = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true }

[features]
default = []
# Expose test-only constructors for integration testing
test-utils = []
# Enable ZK consensus integration with ghost-zkp
zk-consensus = ["ghost-zkp"]
# Enable MPC ceremony integration
mpc-ceremony = ["ghost-mpc"]

[dependencies.ghost-zkp]
workspace = true
optional = true

[dependencies.ghost-mpc]
workspace = true
optional = true

[dev-dependencies]
tempfile = "3.10"
