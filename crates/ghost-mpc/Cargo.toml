[package]
name = "ghost-mpc"
version = "0.1.0"
edition = "2021"
description = "Rolling MPC ceremony for ZK parameter generation in Ghost"
license = "MIT"

[features]
default = []
# Enable for testing without full MPC operations
test-utils = []
# TEST-ONLY: shrink MAX_CEREMONY_CONTRIBUTORS so the Stage D regtest lifecycle
# harness can walk genesis -> contributions -> ossification in seconds. NOT a
# default feature; never enabled by any shipping crate (ghost-pool / ghost-
# consensus). The mainnet binary keeps the 101 cap. See crates/ghost-mpc/src/
# lib.rs MAX_CEREMONY_CONTRIBUTORS and tests/mpc_lifecycle.rs.
mpc-test-cap = []

[dependencies]
# ZK proving system (Groth16 via bellperson)
# Uses phase2 module for MPC ceremony operations
bellperson = "0.26"

# Finite field and curve arithmetic
ff = "0.13"
group = "0.13"

# Pairing-friendly curves for Groth16
blstrs = "0.7"
pairing = "0.23"

# Internal crates
ghost-common = { path = "../ghost-common" }
ghost-storage = { path = "../ghost-storage" }
ghost-zkp = { path = "../ghost-zkp" }

# Cryptography
sha2 = "0.10"
rand = "0.8"
getrandom = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"

# Async
tokio = { version = "1.36", features = ["fs", "io-util", "sync"] }

# Concurrency
parking_lot = "0.12"

# Hex encoding
hex = "0.4"

# Zeroize for secure memory handling
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
tempfile = "3.10"
# Stage D lifecycle harness: model the GET /api/v1/mpc/votes/{position} response
# shape for the autonomous catch-up rehearsal.
serde_json = "1.0"
