[package]
name = "ghost-lock"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = { workspace = true }
bip39 = { workspace = true }
ghost-entropy = { workspace = true }
# For the one atomic-file implementation. default-features = false drops
# ghost-common's UNIX-only `zmq`/`tmq` feature, which the wallet cannot build
# for Windows.
ghost-common = { workspace = true, default-features = false }
bip32 = { workspace = true }
zeroize = { workspace = true }
musig2 = { version = "0.4", default-features = false, features = ["secp256k1"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
secp256k1 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tempfile = "3.10"
