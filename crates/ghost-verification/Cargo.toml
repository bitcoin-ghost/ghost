[package]
name = "ghost-verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP verification endpoints for Bitcoin Ghost node capabilities"

[features]
default = []
# L-29: Enable insecure HTTP/TLS options for development/testing ONLY
# This feature is NOT enabled by default and should NEVER be enabled in release builds
# When disabled, all insecure_for_testing() and danger_accept_invalid_certs options
# are compile-time removed, making insecure configurations impossible
allow-insecure = []

[dependencies]
ghost-common = { workspace = true }
ghost-buds = { workspace = true }
ghost-policy = { workspace = true }
ghost-storage = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
bitcoin = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
uuid = { workspace = true }
libc = "0.2"
# CIDR / plain-IP parsing for the rate-limiter trusted-IP allowlist
ipnet = "2.11"
# TLS for HTTPS (CRIT-API-1)
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
# Integration test for identity-derived TLS handshake
ed25519-dalek = { workspace = true }
