[package]
name = "ghost-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Common types and utilities for Bitcoin Ghost"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bitcoin = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
# Internal-API request signing, shared by every process that speaks the internal HTTP protocol.
hmac = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
# ZMQ block/tx feed for Bitcoin Core notifications. Optional + on by default so
# node crates (ghost-pool, ghost-gsp, …) are unaffected, but wallet crates can
# opt out with `default-features = false` — `tmq` is UNIX-only and won't build
# for the Windows target the Wraith Wallet ships to.
tmq = { workspace = true, optional = true }
tokio = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
futures = { workspace = true }
# H-AUTH-2: Secret management for RPC credentials
secrecy = { workspace = true }
zeroize = { workspace = true }
# L-8: Random temp file suffix to prevent temp file attacks
getrandom = { workspace = true }
# TLS for HTTP servers (CRIT-API-1)
rustls = { workspace = true }
rcgen = { workspace = true }

[features]
# `zmq` gates the Bitcoin Core ZMQ subscriber (`zmq` module + the `tmq` dep).
# Default-on so every node crate keeps it with zero changes; wallet crates set
# `default-features = false` to drop the UNIX-only `tmq` dependency.
default = ["zmq"]
zmq = ["dep:tmq"]

[dev-dependencies]
tempfile = "3"
# The epoch-summary Merkle tree is `ghost_reconciliation::compute_merkle_root`, injected at the
# call sites because a regular dependency would be a cycle (ghost-reconciliation depends on this
# crate). The dev-dependency lets the tests pin the REAL tree with a cross-crate golden vector.
ghost-reconciliation = { workspace = true }
