[package]
name = "ghost-hazync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Hazync — recursive (Nova/folding) validity proof that the UTXO set is the
# correct result of validating the chain. See ghost-web/docs/hazync.md.
#
# Phase 1 = fold N Ghost headers into one recursive cumulative-PoW proof. The
# native step logic below (cumulative_pow) is the SPEC the in-circuit step must
# match byte-for-byte; the Nova StepCircuit encodes it.

[dependencies]
# Folding-scheme recursion (IVC). Chosen over the shielded-pool Groth16 stack
# because Groth16 does not recurse.
nova-snark = "0.38"
# Circuit-building primitives (Nova synthesizes through bellpepper).
ff = "0.13"
# Reference (native, non-circuit) hashing for the spec + tests.
sha2 = { workspace = true }
# Foreign-field (non-native) arithmetic gadget — vendored from nova's crate-
# private `gadgets::nonnative` (bellman-bignat, MIT) into `src/nonnative/` because
# nova does not export it. Powers secp256k1 base-field math for signature checks.
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
byteorder = "1"

[dev-dependencies]
hex = { workspace = true }
ripemd = "0.1"
