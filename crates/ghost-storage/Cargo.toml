[package]
name = "ghost-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SQLite storage layer for Bitcoin Ghost"

[dependencies]
ghost-common = { workspace = true }
rusqlite = { workspace = true, features = ["functions"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }

# H-6: Encryption for sensitive data
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }

# DB-2: Secure memory handling for encryption keys

# H-DB-1: File permissions management
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
