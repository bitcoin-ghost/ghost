# The website's API proxy (scripts/website-proxy/ghost-site-proxy.py), for nginx on the
# bitcoinghost.org host. Add this location inside the site's `server { }` block, then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# nginx only hands the path over; every rule (the configured nodes only, read routes only, GET
# only, fixed ports, timeouts, size cap, no redirects, nothing of the viewer's forwarded) is
# enforced by ghost-site-proxy itself, so a mistake here cannot open it up. What nginx adds is a
# rate limit per viewer. Put the zone in the `http { }` context (for example
# /etc/nginx/conf.d/ghost-site-proxy-zone.conf):
#
#     limit_req_zone $binary_remote_addr zone=ghost_site_proxy:10m rate=10r/s;
#
# The proxy reads its nodes from /etc/ghost/site-proxy-nodes.json (see
# site-proxy-nodes.example.json); their ids are the ones in ghost-web/pool-nodes.json.
#
# The node pool's `location = /api/v1/node-pool/status` is gone: the pages ask each node's
# /api/v1/pool/status through /api/pool/<id>/ instead. Remove that location when this goes in.

# The pages ask each node: /api/pool/<id>/api/v1/pool/status, /api/pool/<id>/api/v1/miner/...
location /api/pool/ {
    limit_except GET { deny all; }
    limit_req zone=ghost_site_proxy burst=40 nodelay;

    # No URI on proxy_pass: the path goes on as the viewer sent it, and ghost-site-proxy matches
    # it before any decoding.
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_redirect off;
    proxy_connect_timeout 2s;
    # ghost-site-proxy answers within its own --timeout (8 s by default).
    proxy_read_timeout 15s;
}
