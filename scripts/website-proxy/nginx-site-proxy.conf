# The website's API proxy (scripts/website-proxy/ghost-site-proxy.py), for nginx on the
# bitcoinghost.org host. Add these two locations inside the site's `server { }` block, then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# nginx only hands the two paths over; every rule (listed hosts only, read routes only, GET
# only, fixed ports, timeouts, size cap, no redirects, nothing of the viewer's forwarded) is
# enforced by ghost-site-proxy itself, so a mistake here cannot open it up. What nginx adds is a
# rate limit per viewer. Put the zone in the `http { }` context (for example
# /etc/nginx/conf.d/ghost-site-proxy-zone.conf):
#
#     limit_req_zone $binary_remote_addr zone=ghost_site_proxy:10m rate=10r/s;
#
# The old fleet's per-node locations (`/api/pool/vm1/` ... `/api/pool/vm8/`) are longer prefixes
# and would still win for those paths; miner.js no longer asks them. Remove them when this goes
# in. `location = /api/pool/summary` (config/ghost-stats) is an exact match and is unaffected.

# The miner page asks each node in node-list.json: /api/pool/<host>/api/v1/...
location /api/pool/ {
    limit_except GET { deny all; }
    limit_req zone=ghost_site_proxy burst=40 nodelay;

    # No URI on proxy_pass: the path goes on as the viewer sent it, and ghost-site-proxy matches
    # it before any decoding.
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_redirect off;
    proxy_connect_timeout 2s;
    # ghost-site-proxy answers within its own --timeout (8 s by default).
    proxy_read_timeout 15s;
}

# The home and pool pages' status tiles: one listed node's status, cached 10 s by the proxy.
location = /api/v1/node-pool/status {
    limit_except GET { deny all; }
    limit_req zone=ghost_site_proxy burst=40 nodelay;

    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_redirect off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
