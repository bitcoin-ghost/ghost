[workspace]
resolver = "2"
members = [
    # Core libraries
    "crates/ghost-common",
    "crates/ghost-buds",
    "crates/ghost-reaper",
    "crates/ghost-policy",
    "crates/ghost-storage",
    "crates/ghost-consensus",
    "crates/ghost-accounting",
    "crates/ghost-verification",
    "crates/ghost-template",
    # Ghost Pay L2
    "crates/ghost-keys",
    "crates/ghost-locks",
    "crates/wraith-protocol",
    "crates/ghost-reconciliation",
    # ZK-BFT Infrastructure
    "crates/ghost-zkp",
    "crates/ghost-mpc",
    # Visual Identity
    "crates/ghost-glyph",
    # GSP
    "crates/ghost-gsp-proto",
    "crates/ghost-gsp",
    # Node Binaries
    "bins/ghost-pool",
    "bins/ghost-pay",
    "bins/ghost-cli",
    "bins/ghost-gsp",
    # Wraith coordinator (Wraith Lite v1, single-round atomic CoinJoin)
    "bins/wraith-coordinator",
    # Registry service for load balancing
    "bins/ghost-registry",
    # Headless setup CLI
    "bins/ghost-setup",
    # Mobile Apps
    "apps/ghost-tap/core",
    "apps/ghost-tap/tests/integration",
    "apps/ghost-tap/desktop/src-tauri",
    # Wraith Wallet (desktop)
    "apps/wraith-wallet/core",
    "apps/wraith-wallet/ipc",
    "apps/wraith-wallet/daemon",
    "apps/wraith-wallet/cli",
    "apps/wraith-wallet/gui/src-tauri",
    # SV2 apps (amalgamated from the former sv2-apps submodule)
    "bins/translator-sv2",
    "bins/pool-sv2",
    "bins/jd-client-sv2",
    "bins/jd-server-sv2",
    "crates/stratum-apps",
    "crates/bitcoin-core-sv2",
    "tests/integration-sv2",
]
exclude = []
# NOTE: Full Node Wallets (ghost-wallet-cli, ghost-wallet-tui) are built from
# the bitcoin-ghost repository since they require ghostd and ghost-crypto.
# Use scripts/build-all-wallets.sh to build all wallet types.

[workspace.package]
version = "1.10.0"
edition = "2021"
rust-version = "1.85"
authors = ["Bitcoin Ghost Team"]
license = "MIT"
repository = "https://github.com/bitcoin-ghost/ghost"

[workspace.dependencies]
# Internal crates
ghost-common = { path = "crates/ghost-common" }
ghost-buds = { path = "crates/ghost-buds" }
ghost-reaper = { path = "crates/ghost-reaper" }
ghost-policy = { path = "crates/ghost-policy" }
ghost-storage = { path = "crates/ghost-storage" }
ghost-consensus = { path = "crates/ghost-consensus" }
ghost-accounting = { path = "crates/ghost-accounting" }
ghost-pool = { path = "bins/ghost-pool" }
ghost-verification = { path = "crates/ghost-verification" }
ghost-template = { path = "crates/ghost-template" }
# Ghost Pay L2 crates
ghost-keys = { path = "crates/ghost-keys" }
ghost-locks = { path = "crates/ghost-locks" }
wraith-protocol = { path = "crates/wraith-protocol" }
ghost-reconciliation = { path = "crates/ghost-reconciliation" }
# ZK-BFT Infrastructure
ghost-zkp = { path = "crates/ghost-zkp" }
ghost-mpc = { path = "crates/ghost-mpc" }
ghost-glyph = { path = "crates/ghost-glyph" }
# GSP crates
ghost-gsp-proto = { path = "crates/ghost-gsp-proto" }
ghost-gsp = { path = "crates/ghost-gsp" }
# Mobile Apps
ghost-tap-core = { path = "apps/ghost-tap/core" }
# Wraith Wallet
wraith-wallet-core = { path = "apps/wraith-wallet/core" }
wraith-wallet-ipc = { path = "apps/wraith-wallet/ipc" }
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Caching
lru = "0.12"

# Networking
tmq = "0.5"
axum = { version = "0.7", features = ["ws"] }
http = "1.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tower = { version = "0.4", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
tower_governor = "0.4"
governor = "0.6"
hyper-util = { version = "0.1", features = ["tokio"] }

# TLS (CRIT-API-1)
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1.14", features = ["std"] }
rcgen = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
bytes = "1.11.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4"] }
parking_lot = "0.12"
once_cell = "1.19"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"

# Cryptography
snow = "0.9"
aes-gcm = "0.10"
getrandom = "0.2"
scrypt = "0.11"
argon2 = "0.5"

# BIP standards
bip39 = "2.0"
bip32 = "0.5"
secp256k1 = { version = "0.29", features = ["rand", "global-context", "serde"] }

# JWT
jsonwebtoken = "9.0"

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Config
config = "0.14"
clap = { version = "4.5", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Additional crypto
k256 = { version = "0.13", features = ["ecdsa"] }
bellperson = "0.26"
blstrs = "0.7"
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
ripemd = "0.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
secrecy = "0.8"

# HTTP
hyper = { version = "1.0", features = ["full"] }

# Unix-specific
libc = "0.2"

# Dev dependencies
tokio-test = "0.4"
proptest = "1.4"

# Encoding
bech32 = "0.11"
bs58 = "0.5"

# FFI
uniffi = "0.27"

# Workspace-level package for integration tests
[package]
name = "bitcoin-ghost-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Internal crates for testing
ghost-common = { workspace = true }
ghost-buds = { workspace = true }
ghost-policy = { workspace = true }
ghost-consensus = { workspace = true, features = ["test-utils", "zk-consensus"] }
ghost-pool = { workspace = true }
ghost-template = { workspace = true }
ghost-keys = { workspace = true }
ghost-locks = { workspace = true }
wraith-protocol = { workspace = true, features = ["dev-mode"] }
ghost-reconciliation = { workspace = true }
ghost-storage = { workspace = true }
ghost-gsp-proto = { workspace = true }
ghost-zkp = { workspace = true }

# Test dependencies
tokio = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
bitcoin = { workspace = true }
tempfile = "3.10"
hex = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "load_tests"
path = "tests/load_tests.rs"

[[test]]
name = "cluster_chaos"
path = "tests/cluster_chaos.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
