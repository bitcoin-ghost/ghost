[package]
name = "ghost-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Local crates to fuzz
ghost-pool = { path = "../bins/ghost-pool" }
ghost-consensus = { path = "../crates/ghost-consensus" }
ghost-common = { path = "../crates/ghost-common" }
ghost-zkp = { path = "../crates/ghost-zkp" }
ghost-gsp-proto = { path = "../crates/ghost-gsp-proto" }
ghost-reconciliation = { path = "../crates/ghost-reconciliation" }
ghost-locks = { path = "../crates/ghost-locks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
bitcoin = { version = "0.32", features = ["serde"] }

[workspace]
members = ["."]

# Fuzz targets - each is a separate binary
[[bin]]
name = "fuzz_stratum_username"
path = "fuzz_targets/fuzz_stratum_username.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_stratum_rpc"
path = "fuzz_targets/fuzz_stratum_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_message_envelope"
path = "fuzz_targets/fuzz_message_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validation"
path = "fuzz_targets/fuzz_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_balance_tree"
path = "fuzz_targets/fuzz_balance_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gsp_messages"
path = "fuzz_targets/fuzz_gsp_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_checkpoint_voting"
path = "fuzz_targets/fuzz_checkpoint_voting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_p2p_payloads"
path = "fuzz_targets/fuzz_p2p_payloads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fee_distribution"
path = "fuzz_targets/fuzz_fee_distribution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ghost_locks"
path = "fuzz_targets/fuzz_ghost_locks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_l2_requests"
path = "fuzz_targets/fuzz_l2_requests.rs"
test = false
doc = false
bench = false
